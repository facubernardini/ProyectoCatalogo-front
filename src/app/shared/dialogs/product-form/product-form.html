<div class="fixed inset-0 z-50 flex justify-end overflow-hidden transition-all duration-500"
    [class.invisible]="!formService.isOpen()">
    
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-500 ease-in-out"
        [class.opacity-0]="!formService.isOpen()"
        [class.opacity-100]="formService.isOpen()"
        (click)="formService.close()">
    </div>

    <div (click)="$event.stopPropagation()"
        class="relative w-full sm:w-112.5 bg-white shadow-2xl flex flex-col transition-transform duration-500 soft-bounce"
        [class.translate-x-full]="!formService.isOpen()"
        [class.translate-x-0]="formService.isOpen()">
        
        <div class="p-4 border-b flex items-center justify-between bg-gray-50/50">
            <div class="flex items-center gap-3">
                <button (click)="formService.close()" class="p-2 hover:bg-gray-200 rounded-full transition-colors">
                    <app-icon name="back" classes="size-5 text-gray-500 fill-current" />
                </button>
                <h2 class="font-bold text-brand-text">
                    {{ formService.editingProduct() ? 'Editar Producto' : 'Nuevo Producto' }}
                </h2>
            </div>
            
            <button (click)="guardar()" 
                    class="px-6 py-2 bg-brand-accent text-white font-bold rounded-xl active:scale-95 transition-all">
                Guardar
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <p class="text-xs text-gray-400 uppercase font-bold mb-4">Información General</p>
            
            <div class="flex flex-col gap-2 mb-6">
                <label class="text-sm font-bold text-gray-700">Nombre del producto</label>
                <input type="text" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:border-brand-accent/30 transition-all" placeholder="Ej: Pizza Napolitana">
            </div>
        </div>
    </div>
</div>
