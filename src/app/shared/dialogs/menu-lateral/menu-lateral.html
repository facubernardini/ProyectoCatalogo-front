<div class="fixed inset-0 z-50 transition-all duration-300 invisible"
    [class.invisible]="!menuService.isOpen()">

    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0"
        [class.opacity-0]="!menuService.isOpen()"
        [class.opacity-100]="menuService.isOpen()"
        (click)="menuService.close()">
    </div>

    <aside class="absolute top-0 left-0 h-full w-70 bg-white shadow-2xl transition-transform duration-300 ease-in-out flex flex-col -translate-x-full"
           [class.-translate-x-full]="!menuService.isOpen()"
           [class.translate-x-0]="menuService.isOpen()">
        
        <div class="p-5 border-b border-gray-100 flex items-center gap-3 shrink-0 z-10 bg-white">
            <img [src]="adminStore.catalogo()?.logo_tienda"
                (click)="infoService.open()"
                alt="Logo de la tienda"
                class="size-14 rounded-full object-cover shadow-sm shrink-0">
                
            <div class="flex-1 px-1">
                <h2 class="text-sm font-bold text-brand-text leading-tight wrap-break-word">
                    {{ adminStore.catalogo()?.nombre_tienda }}
                </h2>
            </div>

            <button (click)="menuService.close()" class="p-2 text-gray-400 shrink-0 self-start mt-2">
                <app-icon name="close" classes="size-6 fill-current" />
            </button>
        </div>

        <div class="px-4 pt-2 flex flex-col shrink-0 bg-white z-10 relative">
            <div class="flex flex-col gap-1 mb-5">
                <button (click)="abrirDestacados()" class="w-full flex items-center justify-between py-2.5 px-3 rounded-xl text-sm font-bold text-gray-700 hover:text-brand-text hover:bg-gray-50 transition-all duration-300 group active:scale-[0.98]">
                    <div class="flex items-center gap-3">
                        <div class="w-5 flex items-center justify-center shrink-0">
                            <span class="text-base animate-pulse">🔥</span>
                        </div>
                        <span>Destacados</span>
                    </div>
                </button>

                <button (click)="abrirOfertas()" class="w-full flex items-center justify-between py-2.5 px-3 rounded-xl text-sm font-bold text-gray-700 hover:text-brand-text hover:bg-gray-50 transition-all duration-300 group active:scale-[0.98]">
                    <div class="flex items-center gap-3">
                        <div class="w-5 flex items-center justify-center shrink-0">
                            <app-icon name="discount" classes="size-4 fill-green-600" />
                        </div>
                        <span>Ofertas</span>
                    </div>
                </button>
            </div>

            <h3 class="text-[10px] font-black uppercase tracking-widest text-brand-text-sec px-3 mb-2">
                Categorías
            </h3>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-4 no-scrollbar flex flex-col relative">
            <div class="space-y-2 flex flex-col">
                @for (cat of categoriasOrdenadas(); track cat.id) {
                    <button (click)="seleccionarYFechar(cat.nombre)"
                            class="w-full flex items-center justify-between py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-300 group overflow-hidden shrink-0"
                            [class]="selected() === cat.nombre ? 'bg-brand-accent/10 text-brand-accent shadow-sm' : 'text-gray-600 hover:bg-gray-50 hover:text-brand-text'">
                        
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="size-1.5 bg-gray-300 group-hover:bg-brand-accent/50 shrink-0 rounded-full transition-colors duration-300"></div>
                            <span class="capitalize truncate" [class.font-black]="cat.especial">{{ cat.nombre }}</span>
                        </div>

                        <app-icon name="chevron-right" classes="size-4 opacity-30" />
                    </button>
                }
            </div>
        </div>

        <div class="p-4 border-t border-gray-100 bg-white flex flex-col gap-2 shrink-0 z-10 relative shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.02)]">
            
            <button (click)="infoService.open()"
                    class="w-full flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100 hover:border-brand-accent/30 hover:bg-brand-accent/5 transition-all group">
                
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="size-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-brand-accent shrink-0 group-hover:scale-110 transition-transform">
                        <app-icon name="time" classes="size-4 fill-current" />
                    </div>
                    <div class="text-left min-w-0">
                        <p class="text-sm font-bold text-brand-text truncate">Horarios de atención</p>
                        <p class="text-[10px] font-semibold text-gray-500 truncate">Consultá nuestros días y horarios</p>
                    </div>
                </div>
                
                <app-icon name="chevron-right" classes="size-4 text-gray-300 group-hover:text-brand-accent transition-colors" />
            </button>

            @if (adminStore.catalogo()?.direccion && adminStore.catalogo()?.ciudad) {
                <button (click)="menuService.close(); mapDialogService.open()"
                        class="w-full flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100 hover:border-brand-accent/30 hover:bg-brand-accent/5 transition-all group">
                    
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="size-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-brand-accent shrink-0 group-hover:scale-110 transition-transform">
                            <app-icon name="location" classes="size-4 fill-current" />
                        </div>
                        <div class="text-left min-w-0">
                            <p class="text-sm font-bold text-brand-text truncate">Ubicación del local</p>
                            <p class="text-[10px] font-semibold text-gray-500 truncate">{{ adminStore.catalogo()?.direccion }}, {{ adminStore.catalogo()?.ciudad }}</p>
                        </div>
                    </div>
                    
                    <app-icon name="chevron-right" classes="size-4 text-gray-300 group-hover:text-brand-accent transition-colors" />
                </button>
            }
        </div>

        <div class="p-4 border-t border-gray-100 bg-gray-50/50 flex items-center justify-center gap-4 shrink-0 z-10">
            
            @if (adminStore.catalogo()?.wpp_numero) {
                <a [href]="'https://wa.me/' + adminStore.catalogo()?.wpp_numero"
                   target="_blank" 
                   rel="noopener noreferrer"
                   aria-label="Contactar por WhatsApp"
                   class="p-3 rounded-full text-green-600 bg-green-100 hover:bg-green-200 active:scale-95 transition-all duration-200 shadow-sm">
                    <app-icon name="whatsapp" classes="size-6 fill-current" />
                </a>
            }

            @if (adminStore.catalogo()?.instagram_usuario) {
                <a [href]="'https://instagram.com/' + adminStore.catalogo()?.instagram_usuario"
                   target="_blank" 
                   rel="noopener noreferrer"
                   aria-label="Ir a Instagram"
                   class="p-3 rounded-full text-pink-600 bg-pink-100 hover:bg-pink-200 active:scale-95 transition-all duration-200 shadow-sm">
                    <app-icon name="instagram" classes="size-6 fill-current" />
                </a>
            }
            
        </div>
    </aside>
</div>
