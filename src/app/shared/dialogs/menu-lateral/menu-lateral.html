<div class="fixed inset-0 z-50 transition-all duration-300"
    [class.invisible]="!menuService.isOpen()">

    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
         [class.opacity-0]="!menuService.isOpen()"
         [class.opacity-100]="menuService.isOpen()"
         (click)="menuService.close()">
    </div>

    <aside class="absolute top-0 left-0 h-full w-70 bg-white shadow-2xl transition-transform duration-300 ease-in-out flex flex-col"
           [class.-translate-x-full]="!menuService.isOpen()"
           [class.translate-x-0]="menuService.isOpen()">
        
        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-lg font-black text-brand-text uppercase tracking-widest">{{adminStore.catalogo()?.nombre_tienda}}</h2>
            <button (click)="menuService.close()" class="p-2 text-gray-400">
                <app-icon name="close" classes="size-6 fill-current" />
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar">
            <button (click)="seleccionarYFechar('todos')"
                    class="w-full flex items-center gap-4 p-4 rounded-2xl font-bold transition-all"
                    [class]="selected() === 'todos' ? 'bg-brand-bg text-brand-accent' : 'text-brand-text hover:bg-gray-50'">
                <app-icon name="category" classes="size-5 fill-current" />
                Todas las categorías
            </button>

            <div class="h-px bg-gray-50 mx-4 my-2"></div>

            @for (cat of categoriasOrdenadas(); track cat.id) {
                <button (click)="seleccionarYFechar(cat.nombre)"
                        class="w-full flex items-center justify-between p-4 rounded-2xl font-bold transition-all group"
                        [class]="selected() === cat.nombre ? 'bg-brand-bg text-brand-accent' : 'text-brand-text hover:bg-gray-50'">
                    
                    <div class="flex items-center gap-4">
                        @if (cat.especial) {
                            <app-icon name="star-filled" classes="size-5 fill-current text-yellow-400" />
                        } @else {
                            <div class="size-2 rounded-full bg-brand-accent/30 group-hover:bg-brand-accent"></div>
                        }
                        <span class="capitalize">{{ cat.nombre }}</span>
                    </div>

                    <app-icon name="chevron-right" classes="size-4 opacity-30" />
                </button>
            }
        </div>
    </aside>
</div>
