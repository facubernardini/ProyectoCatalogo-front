@if (menuService.isOpen()) {
    <div class="fixed inset-0 z-60 bg-black/60 animate-in fade-in duration-300"
        (click)="menuService.close()"></div>

    <div class="fixed top-0 right-0 z-70 h-dvh w-4/5 max-w-sm bg-gray-50 flex flex-col shadow-2xl animate-in slide-in-from-right duration-300">
        
        <div class="flex items-center justify-between p-4 bg-white border-b border-gray-100 pt-[calc(env(safe-area-inset-top)+1.25rem)] shrink-0">
    
            <!-- LADO IZQUIERDO: Foto + Textos -->
            <div class="flex items-center gap-3 min-w-0">
                
                <!-- Foto de la tienda (o placeholder si no hay) -->
                @if (adminStore.catalogo()?.logo_tienda) {
                    <img [src]="adminStore.catalogo()?.logo_tienda" 
                        alt="Logo" 
                        class="size-12 rounded-full object-cover bg-gray-50 border border-gray-100 shrink-0 shadow-sm">
                } @else {
                    <div class="size-12 rounded-full bg-brand-bg flex items-center justify-center shrink-0 border border-brand-accent/10 text-brand-accent">
                        <app-icon name="shop" classes="size-5 fill-current" />
                    </div>
                }

                <!-- Texto -->
                <h2 class="text-base font-bold text-brand-text leading-none pr-2 line-clamp-2">
                    {{ adminStore.catalogo()?.nombre_tienda || 'Mi Tienda' }}
                </h2>
            </div>
            
            <!-- LADO DERECHO: Botón cerrar -->
            <button (click)="menuService.close()" 
                class="p-2 bg-gray-100 text-gray-500 rounded-full active:scale-95 transition-transform md:hover:bg-gray-200 shrink-0"
                aria-label="Cerrar menú">
                <app-icon name="close" classes="size-5 fill-current" />
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-6">
    
            <!-- ACCIONES PRINCIPALES (Agrupadas para mantener buen espaciado) -->
            <div class="flex flex-col gap-3">
                
                <!-- MI PERFIL -->
                <!-- Nota: Cambiá el método (click) por la función que uses para navegar a tu perfil -->
                <button (click)="irAMiPerfil()"
                    class="flex items-center gap-3 p-3 bg-white rounded-2xl border border-gray-100 shadow-sm active:scale-95 transition-all md:hover:border-gray-200 md:hover:shadow md:hover:bg-gray-50 text-left">
                    
                    <div class="p-2 bg-gray-100 text-gray-500 rounded-xl">
                        <app-icon name="profile" classes="size-5 fill-current" />
                    </div>
                    
                    <div class="flex flex-col flex-1">
                        <span class="font-bold text-sm text-brand-text leading-tight">Mi Perfil</span>
                        <span class="text-[10px] font-medium text-gray-400">Gestionar cuenta y plan</span>
                    </div>
                </button>

                <!-- CATALOGO PDF -->
                <button (click)="exportPDFService.generarPdf()"
                    class="flex items-center gap-3 p-3 bg-brand-accent/5 rounded-2xl border border-brand-accent/20 active:scale-95 transition-all md:hover:bg-brand-accent/10 text-left">
                    <div class="p-2 bg-brand-accent text-white rounded-xl shadow-sm">
                        <app-icon name="download-file" classes="size-5 fill-current" />
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-sm text-brand-accent leading-tight">Catálogo PDF</span>
                        <span class="text-[10px] font-medium text-brand-accent/70">Descargar lista de precios</span>
                    </div>
                </button>
                
            </div>

            <!-- SOPORTE Y CIERRE -->
            <div class="mt-auto pt-6 flex flex-col gap-3">
                <button (click)="contactarSoporte()" class="p-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-xs md:hover:bg-gray-200 transition-colors">
                    Contactar soporte
                </button>

                <button (click)="onLogout()" 
                    class="w-full p-3 rounded-xl border-2 border-red-100 text-red-500 font-bold bg-white active:bg-red-50 transition-colors flex items-center justify-center gap-3 shadow-sm md:hover:bg-red-50">
                    <app-icon name="logout" classes="size-4.5 fill-current" />
                    Cerrar Sesión
                </button>
            </div>

        </div>
    </div>
}
