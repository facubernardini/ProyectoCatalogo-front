@if (confirmService.isOpen()) {
    <div class="fixed inset-0 z-110 bg-black/60 animate-backdrop flex flex-col justify-end md:justify-center md:items-center md:p-6 transform-gpu will-change-opacity" 
        (click)="confirmService.cancel()">
        
        <div appSwipeDown (onSwipe)="confirmService.cancel()"
            class="w-full bg-white rounded-t-[40px] md:rounded-3xl md:max-w-sm px-6 py-4 shadow-2xl animate-in slide-in-from-bottom-full md:zoom-in-95 duration-400 ease-out
                transform-gpu will-change-transform backface-hidden" 
            (click)="$event.stopPropagation()">
        
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 md:hidden"></div>

            <div class="text-center mb-4">
                <div class="mx-auto size-14 rounded-2xl flex items-center justify-center mb-2 transition-colors"
                    [class]="confirmService.type() === 'danger' ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-brand-accent'">
                    <app-icon [name]="confirmService.icon()" classes="size-8 fill-current" />
                </div>
                
                <h2 class="text-xl font-bold text-brand-text leading-tight mb-2">{{ confirmService.title() }}</h2>
                <p class="text-gray-500 text-sm px-4">{{ confirmService.message() }}</p>
            </div>

            <div class="flex flex-col md:flex-row-reverse gap-2">
                <button (click)="confirmService.confirm()"
                        class="w-full md:flex-1 py-2.5 md:py-2 text-white font-bold rounded-xl active:scale-95 transition-all md:hover:brightness-120"
                        [class]="confirmService.type() === 'danger' ? 'bg-red-500 shadow-red-200' : 'bg-brand-accent shadow-brand-accent/20'">
                    {{ confirmService.confirmText() }}
                </button>
                
                <button (click)="confirmService.cancel()"
                        class="w-full md:flex-1 py-2.5 md:py-2 text-gray-500 bg-gray-100 rounded-xl font-semibold md:hover:bg-gray-200 transition-colors active:scale-95">
                    {{ confirmService.cancelText() }}
                </button>
            </div>
        </div>
    </div>
}
