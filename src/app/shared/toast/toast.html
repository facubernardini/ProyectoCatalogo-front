<div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-200 w-full max-w-[85%] md:w-max md:min-w-[320px] md:max-w-md flex flex-col gap-2 pointer-events-none">
	@for (toast of toastService.toasts(); track toast.id) {
		<div 
			class="bg-zinc-800 text-white px-4 py-3 rounded-2xl
				flex items-center gap-3 border border-white/10 
				transition-all duration-300 ease-in-out"
				[class.opacity-100]="toast.visible"
				[class.translate-y-0]="toast.visible"
				[class.opacity-0]="!toast.visible"
				[class.translate-y-4]="!toast.visible">
			
			<div class="size-6 rounded-full flex items-center justify-center shrink-0"
				[class.bg-brand-accent]="toast.type === 'success'"
				[class.bg-red-500]="toast.type === 'error'">
				<app-icon [name]="toast.type === 'success' ? 'check' : 'alert'" classes="size-4 fill-white" />
			</div>

			<p class="text-sm font-medium tracking-tight">
				{{ toast.message }}
			</p>
		</div>
	}
</div>
