@if (loadingService.isWorking()) {
    <div class="fixed top-3 left-1/2 -translate-x-1/2 z-9999 pointer-events-none duration-200"
         [class]="loadingService.isHiding() 
            ? 'animate-out fade-out slide-out-to-top-4' 
            : 'animate-in fade-in slide-in-from-top-4'">
            
        <div class="flex items-center bg-gray-900/95 backdrop-blur-sm text-white rounded-full shadow-xl border border-white/10 transition-all"
             [class]="loadingService.message() ? 'gap-2.5 px-3 py-1.5' : 'p-3'">
            
            <div class="size-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            
            @if (loadingService.message()) {
                <span class="text-[10px] font-medium uppercase tracking-widest text-white/90">
                    {{ loadingService.message() }}
                </span>
            }
            
        </div>
    </div>
}
