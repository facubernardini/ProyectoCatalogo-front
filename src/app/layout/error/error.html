<main class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-4">
    
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-gray-100 shadow-sm text-center relative overflow-hidden animate-in zoom-in-95 duration-300">
        
        <div class="absolute top-0 right-0 w-40 h-40 bg-brand-accent/5 rounded-full -translate-y-1/2 translate-x-1/2 blur-2xl pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-brand-accent/5 rounded-full translate-y-1/2 -translate-x-1/2 blur-xl pointer-events-none"></div>
        
        <div class="relative">
            <div class="size-20 bg-brand-accent/10 border-2 border-brand-accent/20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <app-icon name="mood-bad" classes="size-12 text-brand-accent fill-current" />
            </div>
            
            <h1 class="text-6xl font-black text-brand-text tracking-tighter mb-2">
                404
            </h1>
            
            <p class="text-base font-bold text-brand-text-sec leading-relaxed mb-8 px-2">
                El catálogo no existe o ya no pertenece a nuestro sistema.
            </p>
            
            <button 
                (click)="volverAlInicio()" 
                class="w-full py-4 bg-brand-accent text-white font-bold rounded-2xl active:scale-95 transition-transform shadow-md shadow-brand-accent/20 flex items-center justify-center gap-3">
                <app-icon name="home" classes="size-5 fill-current" />
                Volver al inicio
            </button>
        </div>
        
    </div>

    <div class="mt-8 text-[10px] font-black uppercase tracking-widest text-gray-400">
        Plataforma de Catálogos
    </div>

</main>
