<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-brand-bg p-8">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-bg rounded-full mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-brand-text">Bienvenido</h2>
      <p class="text-brand-text-sec text-sm mt-1">Ingresá a tu panel de control</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-semibold text-brand-text mb-2">Correo electrónico</label>
        <div class="relative">
          <input 
            type="email" 
            formControlName="correo" 
            placeholder="tu@correo.com"
            [readonly]="isLoading()"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white read-only:opacity-70 read-only:cursor-not-allowed"
          >
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-brand-text mb-2">Contraseña</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            [readonly]="isLoading()"
            class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white read-only:opacity-70 read-only:cursor-not-allowed"
            (input)="loginForm.get('password')?.value === '' ? showPassword.set(false) : null"
          >
          
          @if (loginForm.get('password')?.value?.length > 0) {
            <button 
              type="button" 
              [disabled]="isLoading()"
              (click)="showPassword.set(!showPassword())"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none animate-in fade-in duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
              aria-label="Alternar visibilidad de la contraseña"
            >
              <app-icon 
                [name]="showPassword() ? 'eye-off' : 'eye'" 
                classes="size-5 fill-current" 
              />
            </button>
          }
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid || isLoading()"
        class="flex items-center justify-center gap-2 w-full bg-brand-accent text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20 hover:bg-[#1e3d5e] active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Iniciando...
        } @else {
          Iniciar Sesión
        }
      </button>

    </form>

    <p class="mt-8 text-center text-xs text-brand-text-sec">
      ¿Olvidaste tu acceso? 
      <a (click)="!isLoading() && recuperarPassword()" 
         [class.opacity-50]="isLoading()"
         [class.cursor-not-allowed]="isLoading()"
         class="text-brand-accent font-semibold hover:underline cursor-pointer transition-opacity">
          Recuperar contraseña
      </a>
    </p>
  </div>
</div>

<app-toast/>
