<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans relative">
	<div class="w-full max-w-md bg-white rounded-4xl shadow-xl border border-brand-bg p-6 relative">

		<!-- CABECERA -->
		<div class="text-center my-5">
            <div class="flex items-center justify-center gap-3 mb-2">
                <img src="assets/home/logo_color.webp" alt="Logo" class="h-8 w-auto object-contain" />
                <h2 class="text-3xl font-extrabold text-brand-accent tracking-tight">
					{{ BRAND_DATA.name }}
				</h2>
            </div>
            <p class="text-brand-text-sec text-base md:text-lg pt-3">Ingresá a tu panel de control</p>
        </div>

		<!-- FORMULARIO -->
		<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
		
			<div>
				<label class="block text-sm font-semibold text-brand-text mb-2">Correo electrónico</label>
				<div class="relative">
					<input 
						type="email" 
						formControlName="correo" 
						placeholder="tu@correo.com"
						[readonly]="isLoading()"
						class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent/40 focus:ring-1 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white read-only:opacity-70 read-only:cursor-not-allowed"
					>
				</div>
			</div>

			<div>
				<div class="flex items-center justify-between mb-2">
					<label class="block text-sm font-semibold text-brand-text">Contraseña</label>
					<a (click)="!isLoading() && recuperarPassword()" 
						[class.opacity-50]="isLoading()"
						[class.cursor-not-allowed]="isLoading()"
						class="text-xs text-brand-accent font-bold md:hover:underline cursor-pointer transition-opacity">
						¿Olvidaste tu contraseña?
					</a>
				</div>
				
				<div class="relative">
				<input 
					[type]="showPassword() ? 'text' : 'password'" 
					formControlName="password" 
					placeholder="••••••••"
					[readonly]="isLoading()"
					class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-200 focus:border-brand-accent/40 focus:ring-1 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white read-only:opacity-70 read-only:cursor-not-allowed"
					(input)="loginForm.get('password')?.value === '' ? showPassword.set(false) : null"
				>
				
				@if (loginForm.get('password')?.value?.length > 0) {
					<button 
						type="button" 
						[disabled]="isLoading()"
						(click)="showPassword.set(!showPassword())"
						class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 md:hover:text-gray-600 transition-colors focus:outline-none animate-in fade-in duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
						aria-label="Alternar visibilidad de la contraseña">
						<app-icon 
							[name]="showPassword() ? 'eye-off' : 'eye'" 
							classes="size-5 fill-current" 
						/>
					</button>
				}
				</div>
			</div>

			<button 
				type="submit" 
				[disabled]="loginForm.invalid || isLoading()"
				class="flex items-center justify-center gap-2 w-full bg-brand-accent text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20 md:hover:bg-brand-accent/90 active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
				@if (isLoading()) {
				<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
					<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
					<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
				</svg>
				Iniciando...
				} @else {
				Iniciar Sesión
				}
			</button>

		</form>

		<p class="mt-8 text-center text-xs text-brand-text-sec">
			¿Todavía no tenés tu catálogo online? 
			<a (click)="!isLoading() && registrarme()"
				class="text-brand-accent font-bold md:hover:underline cursor-pointer transition-opacity">
				Crear tienda gratis
			</a>
		</p>
	</div>
</div>

<app-toast/>
