<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans relative">
	<div class="w-full max-w-md bg-white rounded-4xl shadow-xl border border-brand-bg p-6 relative overflow-hidden">
		
		<!-- BOTÓN VOLVER (Idéntico al Login) -->
		<button type="button" (click)="volver()" 
			class="absolute top-6 left-6 p-2 -ml-2 text-gray-400 md:hover:text-brand-text md:hover:bg-gray-100 rounded-full transition-all focus:outline-none flex items-center gap-1.5 cursor-pointer"
			aria-label="Volver">
			<app-icon name="back" classes="size-6 text-brand-accent fill-current" />
		</button>

		<!-- CABECERA -->
		<div class="text-center my-5">
				<div class="flex items-center justify-center gap-3 mb-3">
					<img src="assets/home/logo_color.webp" alt="Logo" class="h-8 w-auto object-contain" />
					<h2 class="text-3xl font-extrabold text-brand-accent tracking-tight">
						{{ BRAND_DATA.name }}
					</h2>
				</div>
				<p class="text-brand-text-sec text-base md:text-lg pt-3">
					@if (pasoActual() === 1) { Ingresá tu correo para continuar }
					@else { Creá tu nueva contraseña }
				</p>
			</div>

		<!-- PASO 1: Ingresar Correo -->
		@if (pasoActual() === 1) {
			<form [formGroup]="emailForm" (ngSubmit)="pedirCodigo()" class="space-y-6 animate-in fade-in slide-in-from-left-4 duration-500">
				
				<div>
					<label class="block text-sm font-semibold text-brand-text mb-2">Correo electrónico</label>
					<div class="relative">
						<input type="email" formControlName="correo" placeholder="tu@correo.com"
							[readonly]="loading()"
							class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent/40 focus:ring-1 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text read-only:opacity-70 read-only:cursor-not-allowed">
					</div>
				</div>

				<button type="submit" [disabled]="loading() || emailForm.invalid"
						class="flex items-center justify-center gap-2 w-full bg-brand-accent text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20 md:hover:bg-brand-accent/90 active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
					@if (loading()) {
						<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
							<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
							<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
						</svg>
						Enviando...
					} @else {
						Enviar Código
					}
				</button>
			</form>
		}

		<!-- PASO 2: Ingresar Código y Nueva Contraseña -->
		@if (pasoActual() === 2) {
			<form [formGroup]="resetForm" (ngSubmit)="restablecerPassword()" class="space-y-6 animate-in fade-in slide-in-from-right-4 duration-500">
				
				<div class="text-center mb-3 bg-brand-bg/50 rounded-xl p-3 border border-brand-bg/80">
					<p class="text-xs font-semibold text-brand-text-sec">Código enviado a:</p>
					<p class="text-sm font-bold text-brand-accent truncate px-2">{{ emailEnviado }}</p>
				</div>

				<div>
					<label class="block text-sm font-semibold text-brand-text mb-2 text-center">Código de 6 dígitos</label>
					<div class="relative">
						<input type="text" formControlName="codigoOTP" maxlength="6" placeholder="000000"
							[readonly]="loading()"
							class="w-full px-4 py-3 text-center tracking-[0.75em] text-2xl font-black rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-300 bg-gray-50 focus:bg-white text-brand-text read-only:opacity-70 read-only:cursor-not-allowed">
					</div>
				</div>

				<div>
					<label class="block text-sm font-semibold text-brand-text mb-2">Nueva Contraseña</label>
					<div class="relative">
						<input type="password" formControlName="password" placeholder="Mínimo 8 caracteres"
							[readonly]="loading()"
							class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text read-only:opacity-70 read-only:cursor-not-allowed">
					</div>
				</div>

				<div>
					<label class="block text-sm font-semibold text-brand-text mb-2">Repetir Contraseña</label>
					<div class="relative">
						<input type="password" formControlName="confirmPassword" placeholder="Confirmá tu clave"
							[readonly]="loading()"
							class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text read-only:opacity-70 read-only:cursor-not-allowed">
					</div>
				</div>

				<button type="submit" [disabled]="loading() || resetForm.invalid"
						class="flex items-center justify-center gap-2 w-full bg-brand-accent text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20 md:hover:bg-brand-accent/90 active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
					@if (loading()) {
						<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
							<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
							<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
						</svg>
						Guardando...
					} @else {
						Restablecer Contraseña
					}
				</button>
			</form>
		}
	</div>
</div>

<app-toast/>
