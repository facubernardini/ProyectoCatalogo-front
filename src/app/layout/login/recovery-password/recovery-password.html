<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans relative">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-brand-bg p-6 sm:p-8 relative overflow-hidden">
    
    <button (click)="volver()" 
            class="absolute top-5 left-5 p-2 text-gray-400 hover:text-brand-accent active:scale-95 transition-transform rounded-full" 
            aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </button>

    <div class="text-center mb-8 mt-4">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-bg rounded-full mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-brand-text">Recuperar acceso</h2>
      <p class="text-brand-text-sec text-sm mt-1">
        @if (pasoActual() === 1) { Ingresá tu correo para continuar }
        @else { Creá tu nueva contraseña }
      </p>
    </div>

    @if (pasoActual() === 1) {
      <form [formGroup]="emailForm" (ngSubmit)="pedirCodigo()" class="space-y-6 animate-in fade-in slide-in-from-left-4 duration-500">
        
        <div>
          <label class="block text-sm font-semibold text-brand-text mb-2">Correo electrónico</label>
          <input type="email" formControlName="correo"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text text-base">
        </div>

        <button type="submit" [disabled]="loading() || emailForm.invalid"
                class="w-full bg-brand-accent text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-900/20 hover:bg-[#1e3d5e] active:scale-[0.98] transition-all duration-200 disabled:opacity-50 flex justify-center items-center">
          {{ loading() ? 'Enviando...' : 'Enviar Código' }}
        </button>
      </form>
    }

    @if (pasoActual() === 2) {
      <form [formGroup]="resetForm" (ngSubmit)="restablecerPassword()" class="space-y-5 animate-in fade-in slide-in-from-right-4 duration-500">
        
        <div class="text-center mb-2 bg-brand-bg/50 rounded-xl p-3 border border-brand-bg/80">
          <p class="text-xs font-semibold text-brand-text-sec">Código enviado a:</p>
          <p class="text-sm font-bold text-brand-accent truncate px-2">{{ emailEnviado }}</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-brand-text mb-2 text-center">Código de 6 dígitos</label>
          <input type="text" formControlName="codigoOTP" maxlength="6" placeholder="000000"
                 class="w-full px-4 py-3 text-center tracking-[0.75em] text-2xl font-black rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-300 bg-gray-50 focus:bg-white text-brand-text">
        </div>

        <div>
          <label class="block text-sm font-semibold text-brand-text mb-2">Nueva Contraseña</label>
          <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text text-base">
        </div>

        <div>
          <label class="block text-sm font-semibold text-brand-text mb-2">Repetir Contraseña</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirmá tu clave"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-accent focus:ring-4 focus:ring-brand-bg outline-none transition-all duration-200 placeholder:text-gray-400 bg-gray-50 focus:bg-white text-brand-text text-base">
        </div>

        <button type="submit" [disabled]="loading() || resetForm.invalid"
                class="w-full mt-4 bg-brand-accent text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-900/20 hover:bg-[#1e3d5e] active:scale-[0.98] transition-all duration-200 disabled:opacity-50 flex justify-center items-center">
          {{ loading() ? 'Guardando...' : 'Restablecer Contraseña' }}
        </button>
      </form>
    }
  </div>
</div>

<app-toast/>
