<!-- NAV CONTENEDOR -->
<nav class="fixed top-0 left-0 w-full z-50 px-0 transition-all duration-500"
    [class.top-0]="!isScrolled"
    [class.top-4]="isScrolled"
    [class.px-0]="!isScrolled"
    [class.px-4]="isScrolled">

    <!-- CONTENEDOR INTERNO -->
    <div class="relative max-w-7xl mx-auto border border-transparent bg-transparent transition-all duration-500"
        [class.border-transparent]="!isScrolled"
        [class.bg-transparent]="!isScrolled"
        [class.px-4]="!isScrolled"
        [class.sm:px-6]="!isScrolled"
        [class.md:px-8]="!isScrolled"
        [class.border-white/50]="isScrolled"
        [class.bg-white/85]="isScrolled"
        [class.backdrop-blur-md]="isScrolled"
        [class.shadow-lg]="isScrolled"
        [class.shadow-brand-text/5]="isScrolled"
        [class.rounded-full]="isScrolled"
        [class.px-5]="isScrolled">

        <div class="flex items-center justify-between h-14">
        
            <a routerLink="/" class="text-xl md:text-2xl font-semibold tracking-tight text-brand-text transition-opacity hover:opacity-80">
                {{ brand.name }}
            </a>

            <!-- BLOQUE 2: Enlaces (Centro - Solo PC) -->
            <div class="hidden md:flex items-center gap-5">
                @for (opcion of opciones; track opcion.nombre) {
                    <a (click)="scrollToSection(opcion.id)" 
                        class="text-sm font-medium text-brand-text-sec hover:text-brand-text transition-colors cursor-pointer">
                        {{ opcion.nombre }}
                    </a>
                }
            </div>

            <!-- BLOQUE 3: Controles de Sesión (Derecha) -->
            <div class="flex items-center gap-3">
                
                <!-- BOTONES PC -->
                <div class="hidden md:flex items-center gap-2">
                    <button (click)="irALogin()"
                        class="flex items-center justify-center gap-2 px-4 py-1.5 text-sm font-medium text-brand-text bg-white/80 backdrop-blur-sm border border-gray-200/80 rounded-full shadow-sm hover:bg-brand-bg hover:text-brand-text transition-all focus:outline-none active:scale-95">
                        Ingresar
                        <app-icon name="login" classes="size-4 fill-current" />
                    </button>

                    <button (click)="irARegistro()"
                        class="px-5 py-1.5 text-sm font-semibold text-white bg-brand-accent hover:bg-brand-accent/90 rounded-full shadow-sm shadow-brand-accent/20 transition-all focus:outline-none active:scale-95">
                        Probar gratis
                    </button>
                </div>

                <!-- BURGUER MENU (MOBILE) -->
                <div class="md:hidden flex items-center">
                    <button (click)="toggleMenu()" 
                            class="p-2 -mr-2 text-brand-text hover:text-brand-text-sec transition-colors focus:outline-none" 
                            aria-label="Alternar menú">
                        <svg class="size-6 transition-transform duration-300" 
                            [class.rotate-90]="isMenuOpen"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            @if (isMenuOpen) {
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            } @else {
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            }
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- DROPDOWN FLOTANTE MOBILE -->
        <div class="absolute top-full mt-3 bg-white rounded-2xl shadow-xl shadow-brand-text/5 border border-gray-100 flex flex-col md:hidden transition-all duration-300 origin-top scale-95 opacity-0 invisible"
            [class.inset-x-0]="isScrolled"
            [class.inset-x-4]="!isScrolled"
            [class.scale-100]="isMenuOpen"
            [class.opacity-100]="isMenuOpen"
            [class.visible]="isMenuOpen"
            [class.scale-95]="!isMenuOpen"
            [class.opacity-0]="!isMenuOpen"
            [class.invisible]="!isMenuOpen">
            
            @for (opcion of opciones; track opcion.nombre) {
                <a (click)="scrollToSection(opcion.id)" 
                    class="px-4 py-3 text-center text-sm font-semibold text-brand-text-sec hover:bg-brand-bg hover:text-brand-text rounded-xl transition-colors">
                        {{ opcion.nombre }}
                </a>
            }

            <div class="h-px bg-gray-100 my-2 mx-2"></div>

            <div class="flex flex-col gap-2 pb-1 px-1">
                <button (click)="irALogin()"
                    class="w-full flex items-center justify-center gap-2 px-5 py-3 text-sm font-semibold text-brand-text bg-white border border-gray-100 hover:bg-brand-bg rounded-xl transition-all focus:outline-none active:scale-95">
                    Ingresar
                    <app-icon name="login" classes="size-5 fill-current" />
                </button>

                <button (click)="irARegistro()"
                    class="w-full px-5 py-3 text-sm font-semibold text-white bg-brand-accent hover:bg-brand-accent/90 rounded-xl shadow-sm shadow-brand-accent/20 transition-all focus:outline-none active:scale-95">
                    Probar gratis
                </button>
            </div>
        </div>
    </div>
</nav>
