<!-- NAV CONTENEDOR -->
<nav class="fixed left-0 w-full z-50 transition-all duration-500 md:top-0 md:px-0"
    [class.transition-none]="!isMounted"
    [class.top-0]="!isScrolled"
    [class.top-3]="isScrolled"
    [class.px-0]="!isScrolled"
    [class.px-3]="isScrolled">

    <!-- CONTENEDOR INTERNO -->
    <div class="relative max-w-7xl mx-auto border transition-all duration-500 md:max-w-full md:rounded-none md:border-x-transparent md:border-t-transparent"
        [class.transition-none]="!isMounted"
        [class.border-transparent]="!isScrolled"
        [class.bg-brand-accent]="!isScrolled"
        [class.px-6]="!isScrolled"
        [class.rounded-t-none]="!isScrolled"
        [class.rounded-b-4xl]="!isScrolled"
        [class.border-white/50]="isScrolled"
        [class.bg-white/85]="isScrolled"
        [class.backdrop-blur-md]="isScrolled"
        [class.shadow-lg]="isScrolled"
        [class.shadow-brand-text/5]="isScrolled"
        [class.rounded-4xl]="isScrolled"
        [class.px-5]="isScrolled">

        <div class="flex items-center justify-between h-14 max-w-7xl mx-auto w-full">
        
            <!-- LOGO -->
            <a href="/" class="flex items-center gap-2.5 text-xl md:text-2xl font-semibold tracking-tight hover:opacity-80"
                [class.transition-all]="isMounted"
                [class.duration-300]="isMounted"
                [class.text-white]="!isScrolled"
                [class.text-brand-accent]="isScrolled">
                
                <div class="relative h-6 md:h-7 mr-1 flex items-center transition-transform duration-300 md:hover:scale-105">
                    <img src="assets/home/logo.webp" alt="Logo Blanco" 
                        class="h-full w-auto object-contain transition-opacity duration-300" 
                        [class.opacity-0]="isScrolled" />
                    
                    <img src="assets/home/logo_color.webp" alt="Logo Color" 
                        class="absolute inset-0 h-full w-auto object-contain transition-opacity duration-300 opacity-0" 
                        [class.opacity-100]="isScrolled" />
                </div>
                
                <span>{{ brand.name }}</span>
            </a>

            <!-- BLOQUE 2: Enlaces (Centro - Solo PC) -->
            <div class="hidden md:flex px-3 items-center md:gap-3 lg:gap-5">
                @for (opcion of opciones; track opcion.nombre) {
                    
                    <a (click)="scrollToSection(opcion.id)" 
                        class="relative py-1 text-sm font-medium transition-colors cursor-pointer group"
                        
                        [class.text-white]="!isScrolled && isHome && activeSection === opcion.id"
                        [class.text-white/80]="!isScrolled && (!isHome || activeSection !== opcion.id)"
                        [class.hover:text-white]="!isScrolled"
                        
                        [class.text-brand-accent]="isScrolled && isHome && activeSection === opcion.id"
                        [class.text-brand-text-sec]="isScrolled && (!isHome || activeSection !== opcion.id)"
                        [class.hover:text-brand-text]="isScrolled">
                        
                        {{ opcion.nombre }}
                        
                        <span class="absolute left-0 bottom-0 h-0.5 w-full rounded-full origin-left transition-transform duration-300 ease-out"
                            [class.bg-white]="!isScrolled"
                            [class.bg-brand-accent]="isScrolled"
                            [class.scale-x-100]="isHome && activeSection === opcion.id"
                            [class.scale-x-0]="!isHome || activeSection !== opcion.id"
                            [class.group-hover:scale-x-100]="!isHome || activeSection !== opcion.id"
                            [class.group-hover:opacity-50]="!isHome || activeSection !== opcion.id">
                        </span>
                        
                    </a>
                }
            </div>

            <!-- BLOQUE 3: Controles de Sesión (Derecha) -->
            <div class="flex items-center gap-3">
                
                <!-- BOTONES PC -->
                <div class="hidden md:flex items-center gap-2">
                    
                    <!-- Botón "Ingresar" -->
                    <button (click)="irALogin()"
                        class="flex items-center justify-center gap-2 px-4 py-1.5 text-sm font-medium focus:outline-none active:scale-95 rounded-full text-white bg-white/20 hover:bg-white/30 border border-transparent"
                        [class.transition-all]="isMounted"
                        [class.duration-300]="isMounted"
                        [class.text-white]="!isScrolled"
                        [class.bg-white/20]="!isScrolled"
                        [class.border-transparent]="!isScrolled"
                        [class.hover:bg-white/30]="!isScrolled"
                        [class.text-brand-text]="isScrolled"
                        [class.bg-white/80]="isScrolled"
                        [class.backdrop-blur-sm]="isScrolled"
                        [class.border-gray-200/80]="isScrolled"
                        [class.shadow-sm]="isScrolled"
                        [class.hover:bg-brand-bg]="isScrolled">
                        Ingresar
                        <app-icon name="login" classes="size-4 fill-current" />
                    </button>

                    <!-- Botón "Probar gratis" -->
                    <button (click)="irARegistro()"
                        class="px-4 py-1.5 text-sm font-semibold rounded-full shadow-sm focus:outline-none active:scale-95 bg-white text-brand-accent hover:bg-gray-100"
                        [class.transition-all]="isMounted"
                        [class.duration-300]="isMounted"
                        [class.bg-white]="!isScrolled"
                        [class.text-brand-accent]="!isScrolled"
                        [class.hover:bg-gray-100]="!isScrolled"
                        [class.bg-brand-accent]="isScrolled"
                        [class.text-white]="isScrolled"
                        [class.hover:bg-brand-accent/90]="isScrolled"
                        [class.shadow-brand-accent/20]="isScrolled">
                        Probar gratis
                    </button>
                </div>

                <!-- BURGUER MENU (MOBILE) -->
                <div class="md:hidden flex items-center">
                    <button (click)="toggleMenu()" 
                        class="p-2 -mr-2 transition-colors focus:outline-none text-white" 
                        [class.text-white]="!isScrolled"
                        [class.text-brand-accent]="isScrolled"
                        aria-label="Alternar menú">
                        <svg class="size-6 transition-transform duration-300" 
                            [class.rotate-90]="isMenuOpen"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            @if (isMenuOpen) {
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            } @else {
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            }
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- DROPDOWN FLOTANTE MOBILE -->
        <div class="absolute top-full mt-3 bg-white rounded-2xl shadow-xl shadow-brand-text/5 border border-gray-100 flex flex-col md:hidden transition-all duration-300 origin-top scale-95 opacity-0 invisible"
            [class.inset-x-0]="isScrolled"
            [class.inset-x-4]="!isScrolled"
            [class.scale-100]="isMenuOpen"
            [class.opacity-100]="isMenuOpen"
            [class.visible]="isMenuOpen"
            [class.scale-95]="!isMenuOpen"
            [class.opacity-0]="!isMenuOpen"
            [class.invisible]="!isMenuOpen">
            
            @for (opcion of opciones; track opcion.nombre) {
                <a (click)="scrollToSection(opcion.id)" 
                    class="px-4 py-3 text-center text-sm font-semibold text-brand-text-sec hover:bg-brand-bg hover:text-brand-text rounded-xl transition-colors">
                        {{ opcion.nombre }}
                </a>
            }

            <div class="h-px bg-gray-100 my-2 mx-2"></div>

            <div class="flex flex-col gap-2 pb-1 px-1">
                <button (click)="irALogin()"
                    class="w-full flex items-center justify-center gap-2 px-5 py-3 text-sm font-semibold text-brand-text bg-white border border-gray-100 hover:bg-brand-bg rounded-xl transition-all focus:outline-none active:scale-95">
                    Ingresar
                    <app-icon name="login" classes="size-5 fill-current" />
                </button>

                <button (click)="irARegistro()"
                    class="w-full px-5 py-3 text-sm font-semibold text-white bg-brand-accent hover:bg-brand-accent/90 rounded-xl shadow-sm shadow-brand-accent/20 transition-all focus:outline-none active:scale-95">
                    Probar gratis
                </button>
            </div>
        </div>
    </div>
</nav>
