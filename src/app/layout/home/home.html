<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl shadow-slate-100 border border-slate-100">
        <h1 class="text-3xl font-bold tracking-tight text-slate-800 md:text-4xl">
            En desarrollo
        </h1>
        
        <p class="mt-3 text-base text-slate-500 md:text-lg">
            Estamos preparando todo para el catálogo de tiendas. ¡Volvé pronto!
        </p>

        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-2">
            
            <button type="button" 
                    (click)="navegarA('/register')"
                    class="w-full sm:w-auto px-6 py-2.5 bg-brand-accent text-white rounded-xl text-sm font-medium hover:bg-brand-accent/90 active:scale-[0.98] transition-all">
                Registrar tienda
            </button>
            
            <button type="button" 
                    (click)="navegarA('/login')"
                    class="w-full sm:w-auto px-6 py-2.5 bg-brand-accent text-white rounded-xl text-sm font-medium hover:bg-brand-accent/90 active:scale-[0.98] transition-all">
                Iniciar sesión
            </button>
            
        </div>
    </div>
</div>
