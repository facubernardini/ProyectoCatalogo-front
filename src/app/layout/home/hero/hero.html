<section class="relative bg-brand-bg pt-22 pb-16 min-h-screen md:flex md:items-center md:pt-20 md:pb-12 overflow-hidden transition-colors duration-500 z-0">
    
    <!-- FONDO INFERIOR CON MEDIALUNA (Solo Mobile) -->
    <div class="absolute bottom-0 left-0 w-full h-[55%] bg-brand-accent md:hidden -z-10">
        <!-- Curva de la medialuna asomando por encima del bloque -->
        <div class="absolute bottom-full left-1/2 -translate-x-1/2 w-[150%] h-10 bg-brand-accent"
            style="border-top-left-radius: 50% 100%; border-top-right-radius: 50% 100%;">
        </div>
    </div>

    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-8 relative z-10">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 items-center">
            
            <!-- TEXTOS (Quedan ubicados sobre la parte sólida del fondo brand-accent en mobile) -->
            <div class="order-2 md:order-1 flex flex-col items-center md:items-start text-center md:text-left mt-8 md:mt-0">
                
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-white md:text-brand-text leading-tight transition-colors">
                    {{ tituloPrincipal }} 
                </h1>

                <p class="mt-6 text-lg text-white/90 md:text-brand-text-sec max-w-lg transition-colors">
                    {{ subtitulo }}
                </p>
                
                <div class="mt-8 flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                    <button (click)="irARegistro()" 
                        class="inline-flex justify-center items-center px-8 py-3 text-base font-semibold text-brand-accent bg-white md:text-white md:bg-brand-accent hover:opacity-90 rounded-full shadow-lg transition-all focus:outline-none active:scale-95 w-full sm:w-auto">
                        Probar gratis 30 días
                    </button>
                </div>
                
                <p class="mt-4 text-xs font-medium text-white/80 md:text-brand-text-sec opacity-80 transition-colors">
                    Gratis. Sin introducir tu tarjeta.
                </p>

            </div>

            <!-- IMAGEN (Descansa sobre la curva de la medialuna) -->
            <div class="order-1 md:order-2 flex justify-center md:justify-end relative">
                <!-- translate-y-6 ayuda a empujar un poco la imagen hacia abajo para que se hunda sutilmente en la curva -->
                <div class="w-full max-w-md flex items-end justify-center relative">
                    <img src="assets/home/mujer_carrito.webp" alt="Mujer con carrito de compras" class="w-full h-auto object-contain relative z-10" />
                </div>
            </div>

        </div>
    </div>
</section>
