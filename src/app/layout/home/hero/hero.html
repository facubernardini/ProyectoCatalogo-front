<!-- SECCIÓN: Agregamos min-h-screen, flex e items-center para desktop -->
<section class="relative bg-indigo-300 pt-32 pb-16 md:min-h-screen md:flex md:items-center md:pt-20 md:pb-12 overflow-hidden">
    
    <!-- Contenedor principal: Le sumamos 'w-full' para que mantenga el ancho correcto dentro del flex -->
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-8">
        
        <!-- GRID: 1 columna en mobile, 2 columnas en pantallas medianas/grandes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-8 items-center">
            
            <!-- TEXTOS Y BOTÓN -->
            <div class="order-2 md:order-1 flex flex-col items-center md:items-start text-center md:text-left">
                
                <!-- Título -->
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-zinc-900 leading-tight">
                    {{ tituloPrincipal }} 
                    <span class="text-transparent bg-clip-text bg-linear-to-r from-zinc-500 to-zinc-800">
                        {{ tituloResaltado }}
                    </span>
                </h1>

                <!-- Subtítulo -->
                <p class="mt-6 text-lg text-zinc-600 max-w-lg">
                    {{ subtitulo }}
                </p>
                
                <!-- Botón de acción principal -->
                <div class="mt-8 flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                    <button (click)="irARegistro()" 
                        class="inline-flex justify-center items-center px-8 py-3 text-base font-semibold text-white bg-zinc-900 hover:bg-zinc-800 rounded-full shadow-lg shadow-zinc-900/20 transition-all focus:outline-none active:scale-95 w-full sm:w-auto">
                        Probar gratis
                    </button>
                </div>
                
                <!-- Texto de confianza -->
                <p class="mt-2 text-xs font-medium text-zinc-500">
                    No requiere tarjeta de crédito. Cancelá cuando quieras.
                </p>

            </div>

            <!-- CARRUSEL 3D -->
            <div class="order-1 md:order-2 flex justify-center md:justify-end relative">
                
                <div class="w-full max-w-md aspect-square relative flex items-center justify-center animate-float">
                    
                    <div class="relative w-40 h-40" style="perspective: 1000px;">
                        
                        <!-- La "Rueda" central -->
                        <div class="w-full h-full absolute transition-transform duration-700 ease-in-out"
                            style="transform-style: preserve-3d;"
                            [style.transform]="'rotateY(' + rotacionActual + 'deg)'">
                    
                            <!-- ÍCONO 1: Carrito -->
                            <div class="absolute inset-0 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl border border-zinc-200/80"
                                style="transform: rotateY(0deg) translateZ(100px);">
                                <app-icon name="shop-bag" classes="size-16 text-zinc-800" />
                            </div>
                    
                            <!-- ÍCONO 2: Tienda -->
                            <div class="absolute inset-0 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl border border-zinc-200/80"
                                style="transform: rotateY(120deg) translateZ(100px);">
                                <app-icon name="store" classes="size-16 text-zinc-800" />
                            </div>
                    
                            <!-- ÍCONO 3: Canasta -->
                            <div class="absolute inset-0 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl border border-zinc-200/80"
                                style="transform: rotateY(240deg) translateZ(100px);">
                                <app-icon name="shopping_cart" classes="size-16 text-zinc-800" />
                            </div>
                    
                        </div>
                    </div>

                    <!-- Efecto de resplandor sutil (blob) de fondo -->
                    <div class="absolute inset-0 bg-linear-to-tr from-zinc-200 to-zinc-50 rounded-full blur-3xl -z-10 opacity-60"></div>
                </div>

            </div>

        </div>
    </div>
</section>
