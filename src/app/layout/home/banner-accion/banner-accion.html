<section 
    aria-label="Llamado a la acción" 
    class="w-full bg-brand-accent md:py-8 relative z-20">
    
    <!-- MEDIALUNA SUPERIOR -->
    <div class="absolute bottom-full left-0 w-full h-5 md:hidden pointer-events-none z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-full bg-brand-accent"
             style="border-top-left-radius: 50% 100%; border-top-right-radius: 50% 100%;">
        </div>
    </div>

    <!-- MEDIALUNA INFERIOR -->
    <div class="absolute top-full left-0 w-full h-7 md:hidden pointer-events-none z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[150%] h-full bg-brand-accent"
            style="border-bottom-left-radius: 50% 100%; border-bottom-right-radius: 50% 100%;">
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 xl:px-0">
        
        <div class="flex flex-col md:flex-row items-center justify-between gap-6 md:gap-8">
            
            <!-- Textos (Izquierda en PC, Centro en Mobile) -->
            <div class="text-center md:text-left flex-1">
                <h2 class="text-xl md:text-2xl font-bold text-white tracking-tight">
                    ¡Quiero empezar ya!
                </h2>
                <p class="mt-2 text-sm md:text-base text-white/90 font-medium">
                    Registrá tus datos y comenzá tu prueba gratuita.
                </p>
            </div>

            <!-- Botón (Derecha en PC, Abajo en Mobile) -->
            <div class="shrink-0 w-full sm:w-auto mt-1 md:mt-0">
                <button (click)="irARegistro()" 
                    title="Ir al registro para crear tu tienda online"
                    aria-label="Registrar tus datos y comenzar la prueba gratuita de tu tienda"
                    class="group relative inline-flex justify-center items-center px-8 py-3.5 text-sm md:text-base font-bold text-brand-accent bg-white 
                        md:hover:bg-zinc-50 rounded-full shadow-lg md:hover:shadow-xl transition-all duration-300 focus:outline-none overflow-hidden w-full sm:w-auto">
                    
                    <span class="relative z-10 flex items-center gap-2">
                        Crear mi tienda gratis
                        <app-icon name="right-arrow" classes="size-4 fill-current transition-transform duration-300 md:group-hover:translate-x-1" aria-hidden="true" />
                    </span>
                    
                    <div class="absolute inset-0 -translate-x-full animate-[shimmer_3s_infinite] bg-linear-to-r from-transparent via-brand-accent/15 to-transparent w-full z-0" aria-hidden="true"></div>
                </button>
            </div>

        </div>
        
    </div>
</section>
