<!-- Agregamos el ID solicitado y un fondo sutil que lo separe de la sección anterior -->
<section id="tiendas-ejemplo" class="py-24 bg-gray-50 relative overflow-hidden">
    
    <!-- Elemento decorativo de fondo -->
    <div class="absolute inset-0 bg-brand-bg/40 -skew-y-3 origin-top-left -z-10"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 relative z-10">
        
        <!-- Título de la sección -->
        <div class="text-center max-w-2xl mx-auto mb-16">
            <h2 class="text-3xl md:text-4xl font-black tracking-tight text-brand-text mb-4">
                Diseñado para <span class="text-brand-accent">tu rubro</span>
            </h2>
            <p class="text-brand-text-sec text-lg">
                Explorá cómo se ven nuestras tiendas de demostración. Optimizadas para que tus clientes naveguen rápido y compren fácil.
            </p>
        </div>

        <!-- GRID DE TIENDAS -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            @for (tienda of tiendas; track tienda.id) {
                <!-- Tarjeta -->
                <div class="group bg-white rounded-3xl border border-gray-100 shadow-sm hover:shadow-xl hover:shadow-brand-accent/10 hover:-translate-y-1.5 transition-all duration-300 flex flex-col overflow-hidden">
                    
                    <!-- Falso Navegador (Mockup visual) -->
                    <div class="h-44 bg-brand-bg/50 relative p-4 flex flex-col overflow-hidden">
                        
                        <!-- Botonera tipo Mac -->
                        <div class="flex gap-1.5 mb-auto relative z-10">
                            <div class="size-2.5 rounded-full bg-gray-300"></div>
                            <div class="size-2.5 rounded-full bg-gray-300"></div>
                            <div class="size-2.5 rounded-full bg-gray-300"></div>
                        </div>

                        <!-- Círculo decorativo de fondo -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="size-32 bg-white/40 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                        </div>

                        <!-- Ícono Central -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="size-16 bg-white shadow-sm border border-brand-bg rounded-2xl flex items-center justify-center text-brand-accent group-hover:scale-110 group-hover:rotate-3 transition-transform duration-500">
                                <app-icon [name]="tienda.icono" classes="size-8 fill-current" />
                            </div>
                        </div>
                    </div>

                    <!-- Contenido Textual -->
                    <div class="p-6 md:p-8 flex-1 flex flex-col">
                        
                        <!-- Etiqueta del Rubro -->
                        <span class="inline-block px-3 py-1 bg-brand-bg text-brand-accent text-[10px] font-black uppercase tracking-widest rounded-full w-fit mb-4">
                            {{ tienda.rubro }}
                        </span>
                        
                        <h3 class="text-xl font-bold text-brand-text mb-2">
                            {{ tienda.nombre }}
                        </h3>
                        
                        <p class="text-sm text-brand-text-sec leading-relaxed mb-8 flex-1">
                            {{ tienda.descripcion }}
                        </p>

                        <!-- Botón de acción (Enlace directo a la tienda) -->
                        <a [href]="tienda.url" target="_blank" rel="noopener noreferrer"
                           class="mt-auto flex items-center justify-center gap-2 w-full py-3.5 px-4 bg-gray-50 text-brand-text md:hover:bg-brand-accent md:hover:text-white rounded-xl font-bold text-sm transition-all focus:outline-none active:scale-95 border border-gray-100 md:hover:border-brand-accent">
                            Ver tienda en vivo
                            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                    </div>
                </div>
            }

        </div>
    </div>
</section>
