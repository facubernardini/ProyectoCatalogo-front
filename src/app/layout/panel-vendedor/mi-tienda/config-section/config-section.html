<section class="bg-white rounded-2xl border border-brand-bg shadow-sm shadow-blue-100/50 transition-all overflow-hidden"
        [class.ring-1]="editando() && !loading()"
        [class.ring-brand-accent/20]="editando() && !loading()">
      
    <!-- Encabezado con estilo "Mis productos" -->
    <button type="button" 
            (click)="toggleEdit()" 
            class="w-full flex items-center justify-between p-4 group outline-none">
        
        <div class="flex items-center gap-4">
            <!-- Contenedor de Icono -->
            <div class="shrink-0 p-2 bg-brand-bg rounded-xl text-brand-accent">
                <app-icon [name]="icon()" classes="size-6 fill-current" />
            </div>
            
            <!-- Textos -->
            <div class="flex flex-col items-start text-left">
                <span class="text-brand-text font-bold text-lg leading-tight">
                    {{ title() }}
                </span>
                @if (description()) {
                    <span class="text-brand-text-sec text-xs sm:text-sm">
                        {{ description() }}
                    </span>
                }
            </div>
        </div>

        <!-- Chevron con rotación -->
        <div class="text-brand-accent transition-transform duration-300" [class.rotate-180]="editando()">
            <app-icon name="chevron-down" classes="size-6 fill-current" />
        </div>
    </button>

    <!-- Contenido animado -->
    <div class="grid transition-all duration-300 ease-in-out"
         [class]="editando() ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0 pointer-events-none'">
        
        <div class="overflow-hidden">
            <div class="p-4 pt-0">

                <ng-content></ng-content>

                <!-- Botones de acción -->
                <div class="flex items-center justify-end gap-3 mt-3 pt-4 border-t border-brand-bg">
                    <button type="button" 
                            (click)="cancel()"
                            [disabled]="loading()"
                            class="px-4 py-2.5 rounded-xl bg-gray-100 text-gray-500 text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 disabled:opacity-50">
                        Cancelar
                    </button>

                    <button type="button" 
                            (click)="save()"
                            [disabled]="loading()"
                            class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-accent text-white shadow-lg shadow-brand-accent/20 text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 disabled:opacity-50">
                        
                        @if (loading()) {
                            <div class="size-3 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        } @else {
                            <app-icon name="save" classes="size-4 fill-current" />
                        }
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
