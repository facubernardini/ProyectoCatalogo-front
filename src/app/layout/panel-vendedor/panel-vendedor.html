@if (adminStore.isLoading()) {
    <app-loading-spinner/>
} @else {
    <div class="animate-in fade-in duration-500">
        <router-outlet/>
    </div>

    <!-- Dialogs emergentes -->
    <app-product-preview/>
    <app-product-form/>
    <app-category-delete/>
    <app-category-form/>
    <app-category-preview/>
    <app-confirm-dialog/>
    <app-cupon-form/>
    <app-product-import-preview/>

    <!-- Toast -->
    <app-toast/>
}
