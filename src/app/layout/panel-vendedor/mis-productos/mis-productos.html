<header class="sticky top-0 z-50 pt-8 bg-brand-bg border-b border-blue-200 shadow-sm">
  <div class="flex items-center justify-between px-4 h-16 max-w-5xl mx-auto">
    
    <button
        (click)="volverAtras()"
        class="p-2 text-brand-accent active:scale-95 transition-transform"
        aria-label="Volver atrás">
        <app-icon name="back" classes="size-7 fill-current" />
    </button>

    <div class="flex-1 text-center px-2 overflow-hidden">
        <h1 class="text-brand-accentfont-bold text-base truncate">
            Mis productos
        </h1>
    </div>

    <div class="w-11"></div>

  </div>
</header>

<main class="min-h-screen bg-gray-50 p-4">

    <div class="relative w-full max-w-md mx-auto group">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <app-icon name="search" classes="size-6 fill-current text-brand-accent" />
            </div>

            <input 
                type="text" 
                placeholder="Buscar productos..."
                class="w-full pl-11 pr-4 py-3 bg-white border border-brand-bg rounded-xl 
                        text-brand-text placeholder:text-brand-text-sec/60
                        focus:outline-none focus:ring-4 focus:ring-brand-bg focus:border-brand-accent 
                        transition-all duration-300 shadow-sm"
            >
        </div>
    </div>

    <div class="flex items-center gap-2 py-4">
    
        <div class="flex-1 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 z-10 w-4 bg-linear-to-r from-gray-50 via-white/40 to-transparent pointer-events-none"></div>
            <div class="overflow-x-auto no-scrollbar py-1 px-2">
                <div class="flex gap-2">
                    <button 
                        (click)="seleccionarCategoria('todos')"
                        [class]="categoriaSeleccionada() === 'todos' ? 'bg-brand-accent text-white shadow-md' : 'bg-white text-brand-text border border-gray-200'"
                        class="px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all active:scale-95">
                        Todos
                    </button>

                    @for (cat of categorias(); track cat.id) {
                        <button 
                            (click)="seleccionarCategoria(cat.nombre)"
                            [class]="categoriaSeleccionada() === cat.nombre 
                                ? 'bg-brand-accent text-white shadow-md' 
                                : 'bg-white text-brand-text border border-gray-200'"
                            class="px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all active:scale-95">
                            {{ cat.nombre }} 
                        </button>
                    }
                </div>
            </div>
            <div class="absolute right-0 top-0 bottom-0 z-10 w-4 bg-linear-to-l from-gray-50 via-white/40 to-transparent pointer-events-none"></div>
        </div>
        <button 
            (click)="abrirFiltros()"
            class="shrink-0 p-2.5 bg-white border border-gray-200 rounded-xl text-brand-accent shadow-sm active:scale-90 transition-transform">
            <app-icon name="filter" classes="size-6 fill-current" />
        </button>
    </div>

    <div class="flex flex-col gap-3">
        @for (producto of productos(); track producto.id) {
            <div class="flex items-center gap-3 bg-white p-2 rounded-xl border border-gray-100 hover:border-brand-accent/10 transition-all group">
                <div class="relative shrink-0 w-12 h-12 bg-gray-50 rounded-lg overflow-hidden border border-gray-100">
                    <img [src]="producto.imagen || 'https://placehold.co/200x200?text=📦'" 
                        class="object-cover w-full h-full"
                        [class.grayscale]="!producto.activo">
                    
                    <div [class]="producto.activo ? 'bg-green-500' : 'bg-gray-300'" 
                        class="absolute bottom-0.5 right-0.5 size-2.5 rounded-full border-2 border-white shadow-sm">
                    </div>
                </div>
                
                <div class="flex-1 min-w-0">
                    <h3 class="text-brand-text font-bold text-sm truncate">{{ producto.nombre }}</h3>
                    <div class="flex items-center gap-1 text-[10px] text-gray-400 font-medium mt-0.5">
                        <app-icon name="layers" classes="size-3 fill-current" />
                        {{ producto.presentaciones.length }} {{ producto.presentaciones.length === 1 ? 'variante' : 'variantes' }}
                    </div>
                </div>

                <div class="flex items-center gap-1">
                    
                    <button (click)="onView(producto)" 
                            class="p-2 bg-gray-50 text-gray-400 hover:text-brand-accent rounded-lg transition-colors active:scale-90">
                        <app-icon name="info" classes="size-4.5 fill-current" />
                    </button>

                    <button (click)="onToggleFeatured(producto)" 
                            [class]="producto.destacado ? 'text-yellow-500 hover:bg-yellow-100 bg-yellow-50' : 'text-gray-300 hover:text-yellow-500 hover:bg-yellow-50'"
                            class="p-2 rounded-lg transition-colors active:scale-90">
                        <app-icon name="star" classes="size-4.5 fill-current" />
                    </button>

                    <button (click)="onToggleStatus(producto)" 
                            [class]="producto.activo ? 'text-green-500 hover:bg-green-100 bg-green-50' : 'text-gray-300 hover:text-red-400 hover:bg-red-50'"
                            class="p-2 rounded-lg transition-colors active:scale-90">
                        <app-icon [name]="producto.activo ? 'visible' : 'hidden'" classes="size-4.5 fill-current" />
                    </button>

                    <button (click)="onEdit(producto)" 
                            class="ml-1 p-2 bg-gray-50 text-brand-accent hover:bg-brand-accent hover:text-white rounded-lg transition-colors active:scale-90 border border-gray-100">
                        <app-icon name="edit" classes="size-4.5 fill-current" />
                    </button>
                </div>
            </div>
        } @empty {
            <div class="text-center py-10">
                <p class="text-brand-text-sec">No se encontraron productos.</p>
            </div>
        }
    </div>
    

    <div class="fixed bottom-8 right-6 z-50">
        <button (click)="onAdd()"
            class="flex items-center gap-2 bg-brand-accent text-white p-4 rounded-full shadow-2xl shadow-brand-accent/40 active:scale-90 hover:scale-105 transition-all duration-200 group"
            aria-label="Agregar producto">
            <app-icon name="add-producto" classes="size-6 fill-current" />
        </button>
    </div>

    
</main>

<footer>

</footer>
