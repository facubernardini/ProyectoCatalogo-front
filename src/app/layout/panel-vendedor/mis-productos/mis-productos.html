<header class="sticky top-0 z-50 pt-8 bg-brand-bg border-b border-blue-200 shadow-sm">
  <div class="flex items-center justify-between px-4 h-16 max-w-5xl mx-auto">
    
    <button
        (click)="volverAtras()"
        class="p-2 text-brand-accent active:scale-95 transition-transform"
        aria-label="Volver atrás">
        <app-icon name="back" classes="size-7 fill-current" />
    </button>

    <div class="flex-1 text-center px-2 overflow-hidden">
        <h1 class="text-brand-accentfont-bold text-base truncate">
            Mis productos
        </h1>
    </div>

    <button
        class="p-2 text-brand-accent active:scale-95 transition-transform"
        aria-label="Cerrar sesión">
        <app-icon name="profile" classes="size-7 fill-current" />
    </button>

  </div>
</header>

<main class="min-h-screen bg-gray-50 p-4">

    @if (loading()) {
    <div class="flex justify-center p-10">
        <span class="animate-bounce">Cargando productos...</span>
    </div>
    } @else {
    <div class="flex flex-col gap-3 p-4">
        @for (producto of productos(); track producto.id) {
            <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-brand-bg shadow-sm">
                <div class="shrink-0 w-12 h-12 bg-brand-bg rounded-lg overflow-hidden">
                    <img [src]="producto.imagen || 'https://placehold.co/200x200?text=Sin+Imagen'" 
                class="object-cover w-full h-full">
                </div>
                
                <div class="flex-1">
                    <h3 class="text-brand-text font-bold text-sm">{{ producto.nombre }}</h3>
                    <p class="text-brand-accent font-bold">${{ producto.presentaciones[0]?.precio }}</p>
                </div>
            </div>
        } @empty {
            <div class="text-center py-10">
                <p class="text-brand-text-sec">No se encontraron productos.</p>
            </div>
        }
    </div>
    }
    
</main>

<footer>

</footer>
