<div class="flex flex-col h-full w-full bg-white text-gray-700">
    
    <!-- 1. CABECERA: INFO DE LA TIENDA -->
    <div class="flex items-center gap-3 p-4 border-b border-gray-100 shrink-0">
        @if (adminStore.catalogo()?.logo_tienda) {
            <img [src]="adminStore.catalogo()?.logo_tienda" 
                 alt="Logo" 
                 class="size-11 rounded-full object-cover bg-gray-50 border border-gray-100 shrink-0 shadow-sm">
        } @else {
            <div class="size-11 rounded-full bg-brand-bg flex items-center justify-center shrink-0 border border-brand-accent/10 text-brand-accent">
                <app-icon name="shop" classes="size-5 fill-current" />
            </div>
        }
        <div class="flex flex-col min-w-0">
            <h2 class="text-sm font-bold text-brand-text leading-tight truncate">
                {{ adminStore.catalogo()?.nombre_tienda || 'Mi Tienda' }}
            </h2>
            <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mt-0.5">
                Panel Vendedor
            </span>
        </div>
    </div>

    <!-- 2. CONTENIDO CENTRAL (Scrolleable) -->
    <div class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-5">

        <!-- Navegación Principal -->
        <div class="flex flex-col gap-1">
            <span class="px-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Navegación</span>

            <!-- INICIO -->
            <button (click)="navegar('/panel-vendedor/inicio')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/inicio')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/inicio')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/inicio')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/inicio')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/inicio') ? 'home-fill' : 'home'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Inicio
            </button>

            <!-- PRODUCTOS -->
            <button (click)="navegar('/panel-vendedor/mis-productos')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/mis-productos')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/mis-productos')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/mis-productos')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/mis-productos')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/mis-productos') ? 'shop-bag-fill' : 'shop-bag'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Productos
            </button>

            <!-- CATEGORÍAS -->
            <button (click)="navegar('/panel-vendedor/mis-categorias')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/mis-categorias')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/mis-categorias')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/mis-categorias')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/mis-categorias')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/mis-categorias') ? 'category-fill' : 'category'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Categorías
            </button>

            <!-- PEDIDOS -->
            <button (click)="navegar('/panel-vendedor/mis-pedidos')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/mis-pedidos')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/mis-pedidos')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/mis-pedidos')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/mis-pedidos')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/mis-pedidos') ? 'receipt-fill' : 'receipt'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Pedidos
            </button>

            <!-- CUPONES -->
            <button (click)="navegar('/panel-vendedor/mis-cupones')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/mis-cupones')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/mis-cupones')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/mis-cupones')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/mis-cupones')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/mis-cupones') ? 'ticket-fill' : 'ticket'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Cupones
            </button>

            <!-- ESTADÍSTICAS -->
            <button (click)="navegar('/panel-vendedor/estadisticas')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/estadisticas')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/estadisticas')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/estadisticas')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/estadisticas')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/estadisticas') ? 'chart-nav-fill' : 'chart-nav'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Estadísticas
            </button>

            <!-- MI TIENDA -->
            <button (click)="navegar('/panel-vendedor/mi-tienda')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/mi-tienda')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/mi-tienda')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/mi-tienda')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/mi-tienda')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                <app-icon [name]="esRutaActiva('/panel-vendedor/mi-tienda') ? 'shop-fill' : 'shop'" 
                          classes="size-5 fill-current transition-transform group-active:scale-95" />
                Configurar Tienda
            </button>
        </div>

        <!-- Herramientas y Ajustes (Ex Menú Principal) -->
        <div class="flex flex-col gap-1">
            <span class="px-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Herramientas</span>

            <!-- MI PERFIL -->
            <button (click)="irAMiPerfil()"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/perfil')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/perfil')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/perfil')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/perfil')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                
                <app-icon [name]="esRutaActiva('/panel-vendedor/perfil') ? 'profile-fill' : 'profile'" 
                        classes="size-5 fill-current transition-colors group-active:scale-95"
                        [class.text-gray-500]="!esRutaActiva('/panel-vendedor/perfil')"
                        [class.group-hover:text-gray-600]="!esRutaActiva('/panel-vendedor/perfil')" />
                Mi Perfil
            </button>

            <!-- CATÁLOGO PDF -->
            <button (click)="exportPDFService.generarPdf()"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-gray-500 hover:bg-gray-100 transition-all w-full text-left group">
                <app-icon name="download-file" classes="size-5 fill-current text-gray-500 group-hover:text-gray-600 transition-colors" />
                Catálogo PDF
            </button>

            @if (adminStore.productos().length === 0){
                <button (click)="navegar('/panel-vendedor/carga-inicial')"
                [class.bg-brand-accent/10]="esRutaActiva('/panel-vendedor/carga-inicial')"
                [class.text-brand-accent]="esRutaActiva('/panel-vendedor/carga-inicial')"
                [class.text-gray-500]="!esRutaActiva('/panel-vendedor/carga-inicial')"
                [class.hover:bg-gray-100]="!esRutaActiva('/panel-vendedor/carga-inicial')"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-all w-full text-left group">
                
                <app-icon [name]="esRutaActiva('/panel-vendedor/carga-inicial') ? 'cloud-upload-fill' : 'cloud-upload'" 
                        classes="size-5 fill-current transition-colors group-active:scale-95"
                        [class.text-gray-500]="!esRutaActiva('/panel-vendedor/carga-inicial')"
                        [class.group-hover:text-gray-600]="!esRutaActiva('/panel-vendedor/carga-inicial')" />
                Carga Inicial
            </button>
            }
        </div>

    </div>

    <!-- 3. PIE DE MENÚ: SOPORTE Y CERRAR SESIÓN -->
    <div class="px-4 py-2 border-t border-gray-100 flex flex-col gap-2 shrink-0 bg-gray-50/50">
        <button (click)="contactarSoporte()" 
            class="w-full p-2 rounded-xl text-gray-500 font-bold text-[11px] uppercase tracking-wide hover:bg-gray-200 transition-colors">
            Contactar soporte
        </button>

        <button (click)="onLogout()" 
            class="w-full p-2 mt-1 rounded-xl border border-red-100 text-red-500 font-bold bg-white hover:bg-red-50 hover:border-red-200 transition-all flex items-center justify-center gap-2 shadow-sm group">
            <app-icon name="logout" classes="size-4 fill-current group-hover:-translate-x-0.5 transition-transform" />
            Cerrar Sesión
        </button>

        <!-- Firma -->
        <div class="my-0.5 flex items-center justify-center gap-1 opacity-70 hover:opacity-100 transition-opacity cursor-default">
            <span class="text-[12px]">⚡</span>
            <span class="text-[10px] font-medium text-gray-400">by</span>
            <span class="text-[11px] font-black text-gray-600 tracking-tight">Listalo</span>
        </div>
    </div>
    
</div>
