<header class="shrink-0 bg-white border-b border-gray-100 p-2 px-4 z-30 flex items-center justify-between">
    
    <div class="flex items-center py-2 animate-in fade-in slide-in-from-left-2 gap-1.5">
        <app-icon name="chevron-right" classes="size-4 fill-current text-gray-400" />
        <h1 class="text-base font-semibold text-gray-700 leading-none">
            {{ tituloPagina() }}
        </h1>
    </div>

    @if (contextMenu.opciones().length > 0) {
        <div class="flex items-center gap-3 animate-in fade-in slide-in-from-right-2">
            @for (opcion of contextMenu.opciones(); track opcion.label) {
                <button (click)="ejecutarOpcion(opcion)"
                        class="flex items-center gap-2 px-4 py-1.5 text-sm font-medium text-white rounded-xl transition-all active:scale-98"
                        [class.bg-brand-accent]="opcion.color !== 'danger'"
                        [class.hover:bg-brand-accent/90]="opcion.color !== 'danger'"
                        [class.shadow-brand-accent/20]="opcion.color !== 'danger'"
                        [class.bg-red-500]="opcion.color === 'danger'"
                        [class.hover:bg-red-600]="opcion.color === 'danger'"
                        [class.shadow-red-500/20]="opcion.color === 'danger'">
                    <app-icon [name]="opcion.icon" classes="size-4 fill-current" />
                    {{ opcion.label }}
                </button>
            }
        </div>
    }
</header>
