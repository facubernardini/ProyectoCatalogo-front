<header class="sticky top-0 z-50 pt-8 bg-brand-bg border-b border-blue-200 shadow-sm">
    <div class="flex items-center justify-between px-4 h-16 max-w-5xl mx-auto">
        
        <button
            (click)="volverAtras()"
            class="p-2 text-brand-accent active:scale-95 transition-transform"
            aria-label="Volver atrás">
            <app-icon name="back" classes="size-7 fill-current" />
        </button>

        <div class="flex-1 text-center px-2 overflow-hidden">
            <h1 class="text-brand-accentfont-bold text-base truncate">
                Mis categorías
            </h1>
        </div>

        <div class="w-11"></div>

    </div>
</header>

<main class="min-h-screen bg-gray-50 p-4 pb-24">
    <div class="relative w-full max-w-md mx-auto mb-4 group">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <app-icon name="search" classes="size-6 fill-current text-brand-accent" />
            </div>
            <input 
                type="text" 
                [(ngModel)]="filtro"
                placeholder="Buscar categorías..."
                class="w-full pl-11 pr-4 py-3 bg-white border border-gray-100 rounded-xl 
                        text-brand-text placeholder:text-gray-400
                        focus:outline-none focus:ring-4 focus:ring-brand-accent/5 focus:border-brand-accent 
                        transition-all duration-300 shadow-sm"
            >
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-3">
        @for (cat of categoriasFiltradas(); track cat.id) {
            <div class="flex items-center gap-4 bg-white p-3 rounded-2xl border border-gray-100 hover:border-brand-accent/20 transition-all group shadow-sm"
                [class.border-l-4]="cat.especial"
                [class.border-l-amber-400]="cat.especial">
                
                <div class="flex flex-1 items-center gap-4 min-w-0"
                    [class.opacity-50]="!cat.activo">
                    
                    <div class="shrink-0 size-12 rounded-xl flex items-center justify-center transition-colors"
                        [class]="!cat.activo 
                            ? 'bg-gray-100 text-gray-400' 
                            : (cat.especial ? 'bg-amber-50 text-amber-500' : 'bg-brand-bg/30 text-brand-accent')">
                        <app-icon [name]="!cat.activo ? 'hidden' : (cat.especial ? 'star' : 'category')" 
                                classes="size-6 fill-current" />
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-sm truncate uppercase tracking-tight"
                                [class]="!cat.activo ? 'text-gray-400' : 'text-brand-text'">
                                {{ cat.nombre }}
                            </h3>

                            @if (!cat.activo) {
                                <span class="text-[9px] px-1.5 py-0.5 bg-gray-100 text-gray-400 rounded-md font-black uppercase tracking-widest border border-gray-200">
                                    Pausada
                                </span>
                            }
                        </div>

                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] px-2 py-0.5 rounded-lg font-black uppercase transition-colors"
                                [class]="!cat.activo 
                                    ? 'bg-gray-50 text-gray-300' 
                                    : (cat.especial ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-500')">
                                {{ cat.productos_count }} {{ (cat.productos_count === 1) ? 'Producto' : 'Productos' }}
                            </span>
                        </div>
                    </div>
                </div>

                <button (click)="onEditCategory(cat)" 
                        class="p-2 bg-gray-50 text-brand-accent hover:bg-brand-accent hover:text-white rounded-full transition-colors active:scale-90 border border-gray-100">
                    <app-icon name="edit" classes="size-4.5 fill-current" />
                </button>
            </div>
        } @empty {
            <div class="text-center py-20 opacity-40">
                <app-icon name="category" classes="size-16 mx-auto mb-2 fill-gray-300" />
                <p class="text-sm font-bold">No encontramos categorías</p>
            </div>
        }
    </div>

    <div class="fixed bottom-8 right-6 z-50">
        <button (click)="onAddCategory()"
            class="flex items-center gap-2 bg-brand-accent text-white p-4 rounded-full shadow-2xl shadow-brand-accent/40 active:scale-90 hover:scale-105 transition-all duration-200"
            aria-label="Agregar categoría">
            <app-icon name="add-categoria" classes="size-6 fill-current" />
        </button>
    </div>
</main>

<footer>

</footer>
