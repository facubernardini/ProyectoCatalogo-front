<div class="min-w-70 md:min-w-[320px] snap-center group">
    <div class="relative overflow-hidden rounded-2xl bg-white shadow-sm border border-zinc-100 transition-all hover:shadow-md">
        <div class="aspect-square w-full bg-zinc-100 overflow-hidden">
            <img [src]="product().image" [alt]="product().name" class="h-full w-full object-cover">
            <span class="absolute top-3 left-3 bg-brand-accent text-brand-secondary text-[10px] font-bold px-2 py-1 rounded-full uppercase">
                Destacado
            </span>
        </div>

        <div class="p-5">
            <h3 class="text-lg font-semibold text-brand-secondary truncate">{{ product().name }}</h3>
            <div class="mt-2 flex items-center justify-between">
                <span class="text-xl font-bold text-brand-primary">
                    {{ product().price | currency:'USD' }}
                </span>
                <button class="bg-brand-secondary text-white p-2 rounded-lg hover:bg-brand-primary">
                    <app-icon name="shopping_cart" classes="size-5 fill-current" />
                </button>
            </div>
        </div>
    </div>
</div>
