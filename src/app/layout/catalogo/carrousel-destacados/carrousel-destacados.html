<section class="py-8 bg-cat-bg group/section relative">
  <div class="mx-auto max-w-7xl px-4">
    
    <div class="flex items-end justify-between mb-8">
      <div>
        <h2 class="text-3xl font-bold text-brand-secondary">Destacados</h2>
        <p class="text-zinc-500 mt-2">Lo mejor de nuestra tienda</p>
      </div>
    </div>

    <div class="relative items-center flex">
      <button (click)="scroll(-1)" 
              class="absolute -left-4 z-10 bg-white shadow-lg rounded-full p-2 text-brand-secondary 
                hover:text-brand-primary transition-all border border-zinc-100 hidden md:block">
        <app-icon name="chevron_left" classes="size-6 fill-current" />
      </button>

      <div #carousel 
           class="flex gap-6 overflow-x-hidden pb-4 snap-x snap-mandatory scroll-smooth"
           (mouseenter)="stopAutoPlay()" 
           (mouseleave)="startAutoPlay()">
        
        @for (product of featuredProducts; track $index) {
          <app-producto-destacado [product]="product"></app-producto-destacado>
        }
      </div>

      <button (click)="scroll(1)" 
              class="absolute -right-4 z-10 bg-white shadow-lg rounded-full p-2 text-brand-secondary hover:text-brand-primary transition-all border border-zinc-100 hidden md:block">
        <app-icon name="chevron_right" classes="size-6 fill-current" />
      </button>
    </div>

  </div>
</section>
