<section class="w-full py-8 md:py-12">
    <div class="max-w-7xl mx-auto md:px-4">
        
        @for (grupo of categoriasConProductos(); track grupo.categoria.id) {
            <div class="mb-5 last:mb-0">
                
                <!-- ENCABEZADO DE LA CATEGORÍA -->
                <div class="flex items-center justify-between mb-2 px-4 md:px-0">
                    <h2 class="text-sm md:text-base font-black text-brand-text uppercase tracking-widest">
                        {{ grupo.categoria.nombre }}
                    </h2>
                    
                    @if (grupo.tieneMas) {
                        <button (click)="verMas(grupo.categoria)" 
                                class="text-[10px] md:text-xs font-bold text-brand-accent uppercase tracking-widest hover:underline active:opacity-70 transition-opacity">
                            Ver todo
                        </button>
                    }
                </div>

                <!-- CARRUSEL DE PRODUCTOS -->
                <!-- 👇 MODIFICADO: Agregamos scroll-pl-8 para que al scrollear deje un margen y se vea el producto anterior -->
                <div class="flex overflow-x-auto gap-3 md:gap-4 pb-4 px-4 scroll-pl-8 md:scroll-pl-12 snap-x snap-mandatory [&::-webkit-scrollbar]:hidden [-ms-overflow-style:'none'] [scrollbar-width:'none']">
                    
                    @for (prod of grupo.productos; track prod.id) {
                        <!-- 👇 MODIFICADO: w-[42%] en mobile garantiza que siempre entren 2 exactas y se asome la 3ra, sin importar el celular -->
                        <div class="w-[45%] md:w-[30%] lg:w-[22%] shrink-0 snap-start flex">
                            <app-product-card-indumentaria class="w-full" [producto]="prod"></app-product-card-indumentaria>
                        </div>
                    }

                    <!-- TARJETA FINAL: VER MÁS -->
                    @if (grupo.tieneMas) {
                        <div class="w-[42%] md:w-[30%] lg:w-[22%] shrink-0 snap-start flex">
                            <button (click)="verMas(grupo.categoria)"
                                class="w-full h-full min-h-70 flex flex-col items-center justify-center gap-3 bg-gray-50 border border-gray-100 rounded-2xl hover:bg-gray-100 hover:border-brand-accent/30 transition-all group">
                                
                                <div class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:scale-110 group-hover:shadow-md transition-all">
                                    <app-icon name="chevron-right" classes="size-6 text-brand-accent fill-current" />
                                </div>
                                
                                <span class="text-[10px] md:text-xs font-bold text-gray-400 group-hover:text-brand-accent uppercase tracking-widest text-center px-4 transition-colors">
                                    Ver más
                                </span>
                            </button>
                        </div>
                    }
                    
                    <!-- Espaciador final para que el último elemento pueda scrollear hasta el final correctamente -->
                    <div class="w-4 md:hidden shrink-0"></div>
                </div>
                
            </div>
        }
    </div>
</section>
