<section class="w-full py-8 md:py-12">
    <div class="max-w-7xl mx-auto">
        
        @for (grupo of categoriasConProductos(); track grupo.id_grupo) {
            <div class="mb-6 last:mb-0">
                
                <!-- ENCABEZADO DE LA CATEGORÍA -->
                <div class="flex items-center justify-between mb-3 px-4 md:px-0">
                    <h2 class="text-sm md:text-base font-black text-brand-text uppercase tracking-widest">
                        {{ grupo.nombre }}
                    </h2>
                    
                    <button (click)="verMas(grupo.ruta)" 
                            class="text-[10px] md:text-xs font-semibold text-brand-accent uppercase tracking-wide hover:underline active:opacity-70 transition-opacity">
                        Ver todo ({{ grupo.totalProductos }})
                    </button>
                </div>

                <!-- CARRUSEL DE PRODUCTOS (Agregamos #carousel y scroll-smooth) -->
                <div #carousel class="flex overflow-x-auto gap-3 md:gap-4 pb-2 px-4 scroll-pl-8 md:scroll-pl-12 snap-x snap-mandatory scroll-smooth [&::-webkit-scrollbar]:hidden [-ms-overflow-style:'none'] [scrollbar-width:'none']">
                    
                    @for (prod of grupo.productos; track prod.id) {
                        <div class="w-[45%] md:w-[30%] lg:w-[22%] shrink-0 snap-start flex">
                            <app-product-card-indumentaria class="w-full" [producto]="prod"></app-product-card-indumentaria>
                        </div>
                    }

                    <!-- TARJETA FINAL: VER MÁS -->
                    @if (grupo.tieneMas) {
                        <div class="w-[30%] md:w-[20%] lg:w-[12%] shrink-0 snap-start flex">
                            <button (click)="verMas(grupo.ruta)"
                                class="w-full h-full min-h-70 flex flex-col items-center justify-center gap-3 bg-gray-50 rounded-lg shadow-sm md:hover:bg-gray-100 transition-all group">
                                
                                <div class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:shadow-md transition-all">
                                    <app-icon name="chevron-right" classes="size-6 text-brand-accent fill-current" />
                                </div>
                                
                                <span class="text-[10px] md:text-xs font-medium text-gray-500 group-hover:text-brand-accent uppercase tracking-wider text-center px-4 transition-colors">
                                    Ver más
                                </span>
                            </button>
                        </div>
                    }
                </div>
                
                @if (grupo.totalProductos > 4) {
                    <!-- CONTROLES DEL CARRUSEL (Solo Desktop, Abajo a la derecha) -->
                    <div class="hidden md:flex justify-end gap-1">
                        <button (click)="scrollCarousel(carousel, -1)" 
                                class="p-2 flex items-center justify-center text-gray-300 hover:text-brand-accent transition-colors active:scale-90">
                            <app-icon name="chevron-left" classes="size-5 fill-current" />
                        </button>
                        <button (click)="scrollCarousel(carousel, 1)" 
                                class="p-2 flex items-center justify-center text-gray-300 hover:text-brand-accent transition-colors active:scale-90">
                            <app-icon name="chevron-right" classes="size-5 fill-current" />
                        </button>
                    </div>
                }
                
            </div>
        }
    </div>
</section>
