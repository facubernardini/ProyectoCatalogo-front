<nav class="w-full bg-brand-accent px-4 py-3 md:py-4 sticky top-0 z-50 shadow-sm transition-all">
    <div class="mx-auto flex max-w-7xl items-center justify-between">
        
        <!-- 1. IZQUIERDA: Menú Burger y Logo -->
        <div class="flex items-center gap-2 md:gap-3 w-1/4 md:w-1/3">
            
            <!-- Botón Menú Burger -->
            <button (click)="menuService.open()" 
                    class="p-2 -ml-2 text-white hover:text-white/80 active:scale-95 transition-all" 
                    aria-label="Abrir menú">
                <app-icon name="menu" classes="size-6 md:size-7 fill-current" />
            </button>

            <!-- Logo (Movido aquí) -->
            @if (adminStore.catalogo()?.logo_tienda) {
                <img [src]="adminStore.catalogo()?.logo_tienda"
                    alt="Logo"
                    routerLink="/"
                    class="size-9 md:size-12 rounded-full bg-white object-cover shrink-0 cursor-pointer">
            } @else {
                <!-- Fallback Logo -->
                <div routerLink="/" 
                     class="size-6 md:size-8 flex items-center justify-center rounded-full bg-white border border-white/20 shrink-0 cursor-pointer">
                    <app-icon name="shop" classes="size-3 md:size-4 fill-current text-brand-accent" />
                </div>
            }
        </div>

        <!-- 2. CENTRO: Nombre y Eslogan -->
        <div class="flex flex-col pt-0.5 items-center justify-center text-center w-1/2 md:w-1/3 cursor-pointer" 
            routerLink="/">
            
            <!-- Título en blanco -->
            <h1 class="text-base md:text-2xl font-extrabold tracking-tight text-white leading-none uppercase">
                {{ adminStore.catalogo()?.nombre_tienda || 'Cargando...' }}
            </h1>
            
            <!-- Fila: Eslogan -->
            @if (adminStore.catalogo()?.frase_eslogan) {
                <p class="text-[9px] md:text-[10px] font-medium text-white/80 mt-0.5 uppercase tracking-widest line-clamp-1">
                    {{ adminStore.catalogo()?.frase_eslogan }}
                </p>
            }
        </div>

        <!-- 3. DERECHA: Buscador (Lupa) y Carrito -->
        <div class="flex items-center justify-end gap-1 md:gap-4 w-1/4 md:w-1/3">
            
            <!-- Botón Buscador en blanco -->
            <button (click)="abrirBuscador()"
                    class="p-2 text-white hover:text-white/80 active:scale-95 transition-all" 
                    aria-label="Buscar productos">
                <app-icon name="search" classes="size-5 md:size-6 fill-current" />
            </button>

            <!-- Botón Carrito en blanco -->
            <button (click)="cartService.open()" 
                    class="relative p-2 text-white hover:text-white/80 active:scale-95 transition-all" 
                    aria-label="Ver carrito">
                
                <app-icon name="shopping_cart" classes="size-5 md:size-6 fill-current" />
                
                @if (cartService.totalItems() > 0) {
                    <!-- Globo de notificaciones -->
                    <span class="absolute top-0 right-0 md:top-0.5 md:right-0.5 flex size-4 md:size-5 items-center justify-center rounded-full bg-white text-brand-accent text-[9px] md:text-[10px] font-black shadow-sm">
                        {{ cartService.totalItems() }}
                    </span>
                }
            </button>
        </div>

    </div>
</nav>
