@if (adminStore.isLoading()) {
    <app-catalogo-skeleton/>
} @else {
    @if (isDesktop()) {
        <!-- Layout Desktop (VER) -->
        <app-navbar-desktop/>
        <app-banner-info-desktop/>

        <div class="mx-auto flex max-w-7xl items-start gap-8 p-5">
            <aside class="w-72 shrink-0">
                <app-menu-lateral-desktop/>
            </aside>
            <main class="flex-1 min-w-0 flex flex-col gap-10">
                <!--REHACER ESTOS COMPONENTES-->
                <app-carousel-destacados/>
                <app-carousel-ofertas/>
                <app-lista-productos/>
            </main>
        </div>
    }
    @else {
        <!-- Layout Mobile -->
        <app-navbar/>
        <app-banner-info/>
        <app-search-nav/>
        <app-carousel-destacados/>
        <app-carousel-ofertas/>
        <app-lista-productos/>
    }

    <!-- Dialogs emergentes (REHACER COMPONENTES PARA DESKTOP, PERO USAR MISMOS SERVICIOS) -->
    <app-search-products/>
    <app-carrito/>
    <app-menu-info/>
    <app-product-selector/>
    <app-menu-lateral/>
    <app-category-products-view/>
    <app-map-dialog/>
    <app-productos-destacados/>
    <app-productos-ofertas/>
    <app-pedido-realizado/>

    <!-- Toast -->
    <app-toast/>
}
