@if (adminStore.isLoading()) {
    <app-catalogo-skeleton/>
} @else {
    @if (isDesktop()) {
        <!-- Layout Desktop -->
        <div class="min-h-screen flex flex-col">
            <app-navbar-desktop class="contents" />

            <div class="flex-1 w-full flex items-start gap-4 py-3 sm:px-2 lg:px-4">
        
                <aside class="w-72 shrink-0 sticky top-28 overflow-y-auto">
                    <app-menu-lateral-desktop/>
                </aside>
                
                <main class="flex-1 min-w-0 flex flex-col self-stretch">
                    @if (exploradorProductosService.vistaActual() === 'home') {
                        <app-carousel-destacados-desktop/>
                        <app-carousel-ofertas-desktop/>
                        <app-lista-productos-desktop/>
                    } 
                    @else {
                        <app-explorador-productos-desktop class="flex-1 flex flex-col"/>
                    }
                </main>
            </div>

            <app-footer-desktop/>
        </div>

        <!-- Dialogs emergentes -->
        <app-carrito/>
        <app-menu-info/>
        <app-product-selector/>
        <app-map-dialog/>
        <app-pedido-realizado/>
        <app-confirm-dialog/>
        <app-image-viewer/>
    }
    @else {
        <!-- Layout Mobile -->
        <div class="min-h-screen flex flex-col">
            
            <app-navbar/>
            
            <main class="flex-1 flex flex-col w-full">
                <app-banner-info/>
                <app-search-nav class="contents" />
                <app-carousel-destacados/>
                <app-carousel-ofertas/>
                <app-lista-productos/>
            </main>

            <app-footer-desktop/>
            
        </div>

        <!-- Dialogs emergentes -->
        <app-search-products/>
        <app-carrito/>
        <app-menu-info/>
        <app-product-selector/>
        <app-menu-lateral/>
        <app-category-products-view/>
        <app-map-dialog/>
        <app-productos-destacados/>
        <app-productos-ofertas/>
        <app-pedido-realizado/>
        <app-confirm-dialog/>
        <app-image-viewer/>
    }

    <!-- Toast -->
    <app-toast/>
}
