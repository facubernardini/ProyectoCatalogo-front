@if (adminStore.isLoading()) {
    <app-catalogo-skeleton/>
} @else {
    @if (isDesktop()) {
        <!-- Layout Desktop (VER) -->
        <app-navbar/>
        <app-banner-info/>
        <app-search-nav/>
        <app-carousel-destacados/>
        <app-carousel-ofertas/>
        <app-lista-productos/>

    }
    @else {
        <!-- Layout Mobile -->
        <app-navbar/>
        <app-banner-info/>
        <app-search-nav/>
        <app-carousel-destacados/>
        <app-carousel-ofertas/>
        <app-lista-productos/>
    }

    <!-- Dialogs emergentes -->
    <app-search-products/>
    <app-carrito/>
    <app-menu-info/>
    <app-product-selector/>
    <app-menu-lateral/>
    <app-category-products-view/>
    <app-map-dialog/>
    <app-productos-destacados/>
    <app-productos-ofertas/>
    <app-pedido-realizado/>

    <!-- Toast -->
    <app-toast/>
}
