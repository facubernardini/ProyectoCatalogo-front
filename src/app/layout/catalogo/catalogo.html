<app-navbar></app-navbar>

<div class="relative w-full max-w-md mx-auto group px-4 py-2">
    <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <app-icon name="search" classes="size-6 fill-current text-brand-accent" />
        </div>

        <input 
        type="text" 
        placeholder="Buscar productos..."
        class="w-full pl-11 pr-4 py-3 bg-white border border-brand-bg rounded-xl 
                text-brand-text placeholder:text-brand-text-sec/60
                focus:outline-none focus:ring-4 focus:ring-brand-bg focus:border-brand-accent 
                transition-all duration-300 shadow-sm"
        >
    </div>
</div>

<app-carrousel-destacados [productosDestacados]="productosDestacados()"></app-carrousel-destacados>

<app-lista-productos [categorias]="categorias()"></app-lista-productos>
