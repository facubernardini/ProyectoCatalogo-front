<main class="min-h-screen bg-brand-bg flex flex-col items-center justify-center px-4 relative overflow-hidden">

    <div class="max-w-md w-full text-center relative z-10 animate-in zoom-in-95 fade-in duration-500">
        
        <img src="assets/not-found.svg" alt="Tienda no encontrada" class="w-56 h-auto mx-auto mb-8 drop-shadow-sm">
        
        <h1 class="text-xl md:text-2xl font-black text-brand-text tracking-tight mb-3 px-2">
            No pudimos encontrar la tienda que estás buscando
        </h1>
        
        <p class="text-base font-medium text-gray-500 leading-relaxed px-4 mb-6">
            Revisá que hayas escrito correctamente el enlace de la tienda.
        </p>
        
        <button (click)="volverAlInicio()" 
            class="inline-flex items-center justify-center w-full px-5 py-3 bg-brand-accent text-white font-bold rounded-xl shadow-lg shadow-brand-accent/20 active:scale-95 md:hover:bg-brand-accent/90 transition-all duration-200 focus:outline-none">
            Volver a un lugar seguro
        </button>
        
    </div>

</main>
