<nav class="w-full border-b border-white/10 bg-brand-accent text-white px-4 py-2">
    <div class="mx-auto flex max-w-7xl items-center justify-between">
        
        <img [src]="adminStore.catalogo()?.logo_tienda"
            (click)="infoService.open()"
            alt="Logo de la tienda"
            class="size-14 rounded-full bg-white object-cover shadow-sm cursor-pointer hover:opacity-90 transition-opacity">

        <div class="flex flex-col pt-2 items-center text-center">
            <h1 class="text-xl font-black tracking-tighter text-white leading-none">
                {{ adminStore.catalogo()?.nombre_tienda || 'Cargando...' }}
            </h1>
            
            @if (adminStore.catalogo()?.frase_eslogan) {
                <p class="text-xs font-semibold text-white/80 mt-0.5 truncate max-w-50">
                    {{ adminStore.catalogo()?.frase_eslogan }}
                </p>
            }
        </div>

        <button 
            (click)="infoService.open()" 
            class="flex items-center gap-2 text-white p-2 transition-all active:scale-95" aria-label="Menú">
            
            <app-icon name="info" classes="size-7 fill-current text-white" />
            
        </button>

    </div>
</nav>
