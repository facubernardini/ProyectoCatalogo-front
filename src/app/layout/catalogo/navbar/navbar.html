<nav class="w-full border-b border-zinc-100 bg-white px-4 py-2">
  <div class="mx-auto flex max-w-7xl items-center justify-between">
    
    <img [src]="adminStore.catalogo()?.logo_tienda"
      (click)="infoService.open()"
      alt="Logo de la tienda"
      class="size-14 rounded-full object-cover shadow-sm">

    <div class="flex flex-col pt-2 items-center text-center">
      <h1 class="text-xl font-black tracking-tighter text-brand-accent leading-none">
        {{ adminStore.catalogo()?.nombre_tienda || 'Cargando...' }}
      </h1>
      
      @if (adminStore.catalogo()?.frase_eslogan) {
        <p class="text-xs font-semibold text-gray-500 mt-0.5 truncate max-w-50">
          {{ adminStore.catalogo()?.frase_eslogan }}
        </p>
      }
    </div>

    <button (click)="infoService.open()" class="text-gray-400 hover:text-brand-accent p-2 transition-colors active:scale-90" aria-label="Menú">
      <app-icon name="info" classes="size-7 fill-current text-brand-accent" />
    </button>

  </div>
</nav>
