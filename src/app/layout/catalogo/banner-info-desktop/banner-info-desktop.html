@if (anunciosBanner().length > 0) {
    <div class="w-full bg-white">
        <div class="w-full bg-brand-accent/20 text-brand-accent overflow-hidden py-1.5 text-xs font-bold uppercase tracking-widest">
            
            <div class="animate-marquee flex w-max">
                
                @for (bloque of [1, 2]; track bloque) {
                    
                    <div class="flex items-center" [attr.aria-hidden]="bloque === 2 ? 'true' : null">
                        
                        @for (msg of anunciosRepetidos(); track $index) {
                            <span class="flex items-center gap-2 whitespace-nowrap">
                                <app-icon [name]="msg.icono" classes="size-4 fill-current"></app-icon>
                                {{ msg.texto }}
                            </span>
                            
                            <div class="size-1.5 rounded-full bg-brand-accent/40 shrink-0 mx-8"></div>
                        }
                        
                    </div>
                    
                }
                
            </div>
        </div>
    </div>
}
