<div #sentinel class="h-px bg-brand-accent w-full pointer-events-none"></div>

<header #stickyHeader
    class="sticky top-0 z-40 w-full flex flex-col transition-all duration-300 ease-in-out">
    
    <nav class="w-full bg-brand-accent border-b border-white/10 text-white">
        
        <div class="mx-auto flex max-w-7xl items-center gap-8 px-6 py-3">
            
            <div class="flex items-center gap-4 shrink-0 cursor-pointer group" (click)="infoService.open()">
                <img [src]="adminStore.catalogo()?.logo_tienda"
                    alt="Logo de la tienda"
                    class="size-14 rounded-full bg-white object-cover shadow-sm group-hover:opacity-90 group-hover:scale-105 transition-all duration-300">

                <div class="flex flex-col justify-center">
                    <h1 class="text-2xl font-black tracking-tighter leading-none group-hover:text-white/80 transition-colors">
                        {{ adminStore.catalogo()?.nombre_tienda || 'Cargando...' }}
                    </h1>
                    
                    @if (adminStore.catalogo()?.frase_eslogan) {
                        <p class="text-sm font-semibold text-white/80 mt-1 truncate max-w-62.5">
                            {{ adminStore.catalogo()?.frase_eslogan }}
                        </p>
                    }
                </div>
            </div>

            <div class="relative flex-1 max-w-2xl group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <app-icon name="search" classes="size-5 fill-current text-gray-400 group-focus-within:text-brand-accent transition-colors" />
                </div>

                <input 
                    type="text" 
                    placeholder="Buscar productos..."
                    [value]="searchService.query()"
                    (input)="onSearch($event)"
                    class="w-full pl-11 pr-10 py-2.5 bg-white border border-transparent rounded-xl 
                        text-brand-text placeholder:text-gray-400
                        focus:outline-none focus:ring-4 focus:ring-white/30 
                        transition-all duration-300 shadow-inner"
                >

                @if (searchService.query()) {
                    <button (click)="clearSearch()" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 transition-colors active:scale-90">
                        <app-icon name="close-circle" classes="size-6 fill-current" />
                    </button>
                }
            </div>

            <div class="flex items-center gap-3 shrink-0">
                
                <button 
                    (click)="infoService.open()" 
                    class="flex items-center gap-2 px-4 py-2.5 text-white bg-transparent border border-white/30 rounded-xl hover:bg-white/10 hover:border-white/60 transition-all active:scale-95 group" 
                    aria-label="Info del local">
                    <app-icon name="info" classes="size-5 fill-current group-hover:scale-110 transition-transform" />
                    <span class="text-sm font-bold">
                        Info del local
                    </span>
                </button>

                <button 
                    (click)="cartService.open()" 
                    class="relative flex items-center gap-2 px-6 py-2.5 bg-white text-brand-accent rounded-xl shadow-sm hover:shadow-lg hover:scale-[1.02] transition-all active:scale-95 group" 
                    aria-label="Ver carrito">
                    <app-icon name="shopping_cart" classes="size-5 fill-current group-hover:-rotate-12 transition-transform" />
                    <span class="text-sm font-bold">Carrito</span>
                    
                    @if (cartService.totalItems() > 0) {
                        <span class="absolute -top-2 -right-2 flex size-6 items-center justify-center rounded-full bg-red-500 text-xs font-bold text-white border-2 border-white shadow-sm animate-in zoom-in">
                            {{ cartService.totalItems() }}
                        </span>
                    }
                </button>
                
            </div>
        </div>
    </nav>

    <app-banner-info-desktop />

</header>
