<div class="px-3">
    <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-bold text-brand-text flex items-center gap-2">
            Todos los productos
        </h2>
        
        <button 
            (click)="abrirFiltros()"
            class="shrink-0 p-2 bg-white border border-gray-200 rounded-lg text-brand-accent shadow-xs active:scale-90 transition-transform">
            <app-icon name="filter" classes="size-5 fill-current" />
        </button>
    </div>

    <div class="mb-3 w-full overflow-x-auto no-scrollbar">
        <div class="flex gap-1">
            @for (cat of categoriasOrdenadas(); track cat.id) {
                <button 
                    (click)="seleccionarCategoria(cat.nombre)"
                    [class]="categoriaSeleccionada() === cat.nombre 
                        ? 'bg-brand-accent text-white' 
                        : (cat.especial 
                            ? 'bg-white/80 backdrop-blur-md border border-brand-accent' 
                            : 'bg-white text-brand-text border border-gray-200')"
                    class="relative overflow-hidden px-3 py-1 rounded-full text-[12px] font-semibold whitespace-nowrap transition-all active:scale-95 shrink-0">
                    
                    @if (cat.especial && categoriaSeleccionada() !== cat.nombre) {
                        <div class="absolute inset-0 h-full w-full bg-linear-to-r from-transparent via-brand-accent/15 to-transparent animate-shimmer"></div>
                    }

                    <div class="relative z-10 flex items-center justify-center">                           
                        <span class="text-start" 
                            [class.text-brand-accent]="cat.especial && categoriaSeleccionada() !== cat.nombre">
                            {{ cat.nombre | titlecase }}
                        </span>
                    </div>
                </button>
            }
        </div>
    </div>

    <div class="pb-5"> 
        <div class="flex flex-col gap-3">
            @for (producto of productosVisibles(); track producto.id) {
                <app-product-card [producto]="producto"></app-product-card>
            } @empty {
                <div class="flex flex-col items-center justify-center py-20 text-center">
                    <div class="bg-gray-100 p-6 rounded-full mb-4">
                        <app-icon name="empty" classes="size-12 text-gray-400 fill-current" />
                    </div>
                    <h3 class="text-gray-500 font-bold">Sin resultados</h3>
                </div>
            }
        </div>
        
        @if (productosVisibles().length < productos().length) {
            <div class="py-6 flex justify-center">
                <div class="size-6 border-2 border-brand-accent border-t-transparent rounded-full animate-spin"></div>
            </div>
        }
    </div>
</div>

@if (mostrarModalFiltros()) {
    <div class="fixed inset-0 z-60 bg-black/60 fade-in" (click)="cerrarFiltros()">
        <div appSwipeDown
            (onSwipe)="cerrarFiltros()"
            class="absolute bottom-0 left-0 w-full bg-white rounded-t-4xl p-4 shadow-2xl animate-in" 
            (click)="$event.stopPropagation()">
            
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-lg font-black text-brand-text mb-4">Ordenar por</h3>

            <div class="flex flex-col gap-2">
                <button (click)="aplicarOrden('default')"
                        [class.bg-brand-bg]="ordenSeleccionado() === 'default'"
                        class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-100 active:scale-95 transition-all text-left">
                    <span class="flex items-center gap-2 font-semibold text-brand-text">
                        <app-icon name="sparks" classes="size-4 text-brand-accent fill-current" />
                        Por defecto
                    </span>
                    @if (ordenSeleccionado() === 'default') {
                        <app-icon name="check" classes="size-5 text-brand-accent fill-current" />
                    }
                </button>

                <button (click)="aplicarOrden('menor-precio')"
                        [class.bg-brand-bg]="ordenSeleccionado() === 'menor-precio'"
                        class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-100 active:scale-95 transition-all text-left">
                    <span class="flex items-center gap-2 font-semibold text-brand-text">
                        <app-icon name="filter-by-price" classes="size-5 text-brand-accent fill-current rotate-180" />
                        Menor precio
                    </span>
                    @if (ordenSeleccionado() === 'menor-precio') {
                        <app-icon name="check" classes="size-5 text-brand-accent fill-current" />
                    }
                </button>

                <button (click)="aplicarOrden('mayor-precio')"
                        [class.bg-brand-bg]="ordenSeleccionado() === 'mayor-precio'"
                        class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-100 active:scale-95 transition-all text-left">
                    <span class="flex items-center gap-2 font-semibold text-brand-text">
                        <app-icon name="filter-by-price" classes="size-5 text-brand-accent fill-current" />
                        Mayor precio
                    </span>
                    @if (ordenSeleccionado() === 'mayor-precio') {
                        <app-icon name="check" classes="size-5 text-brand-accent fill-current" />
                    }
                </button>

                <button (click)="aplicarOrden('alfa')"
                        [class.bg-brand-bg]="ordenSeleccionado() === 'alfa'"
                        class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-100 active:scale-95 transition-all text-left">
                    <span class="flex items-center gap-2 font-semibold text-brand-text">
                        <app-icon name="filter-by-alpha" classes="size-5 text-brand-accent fill-current" />
                        Alfabéticamente
                    </span>
                    @if (ordenSeleccionado() === 'alfa') {
                        <app-icon name="check" classes="size-5 text-brand-accent fill-current" />
                    }
                </button>
            </div>

            <button (click)="cerrarFiltros()" 
                    class="w-full mt-5 py-2 bg-brand-accent text-white font-semibold rounded-xl active:scale-95 transition-transform">
                Listo
            </button>
        </div>
    </div>
}
