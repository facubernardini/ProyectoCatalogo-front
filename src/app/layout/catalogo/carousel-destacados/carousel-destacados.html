@if (productosDestacados().length > 0) {
    <section class="mt-2">
        <h2 class="px-4 mb-4 text-xl font-bold text-brand-text">Lo más pedido 🔥</h2>
        
        <div class="relative">
            
            <div class="absolute left-0 top-0 bottom-0 z-10 w-5 bg-linear-to-r from-brand-bg via-brand-bg/50 to-transparent pointer-events-none"></div>

            <div class="flex overflow-x-auto gap-4 px-4 pb-2 snap-x snap-mandatory no-scrollbar">
                @for (producto of productosDestacados(); track producto.id) {
                    <div class="shrink-0 w-[75%] sm:w-80 bg-white rounded-3xl overflow-hidden shadow-md snap-center border border-gray-100">
                        <div class="relative h-44 bg-brand-bg">
                            <img [src]="producto.imagen || 'https://placehold.co/400x300'" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm">
                                <span class="text-xs font-bold text-brand-accent italic">Destacado</span>
                            </div>
                        </div>

                        <div class="p-4">
                            <h3 class="font-bold text-brand-text text-lg mb-1">{{ producto.nombre }}</h3>
                            <p class="text-brand-text-sec text-sm line-clamp-1 mb-3">{{ producto.descripcion }}</p>
                            
                            <div class="flex items-center justify-between">
                                <div class="flex items-baseline gap-1">
                                    @if (producto.presentaciones.length > 1) {
                                        <span class="mr-0.5 text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Desde</span>
                                    }
                                    <span class="text-brand-accent font-black text-xl">${{ producto.presentaciones[0]?.precio }}</span>
                                </div>

                                <button (click)="productSelectorService.open(producto)"
                                        class="bg-brand-accent text-white p-2 rounded-xl active:scale-90 transition-transform">
                                    <app-icon name="shop-add" classes="size-5 fill-current" />
                                </button>
                            </div>
                        </div>
                    </div>
                }
            </div>

            <div class="absolute right-0 top-0 bottom-0 z-10 w-5 bg-linear-to-l from-brand-bg via-brand-bg/50 to-transparent pointer-events-none"></div>
            
        </div>
    </section>
}
