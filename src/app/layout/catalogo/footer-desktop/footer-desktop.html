<footer class="w-full py-10 mt-auto px-4 bg-transparent">
    <div class="max-w-5xl mx-auto flex flex-col items-center gap-6 text-center">
    
        <button (click)="irACreacion()"
                class="px-6 py-3 bg-brand-accent text-white text-xs font-black rounded-xl shadow-lg shadow-brand-accent/30 hover:scale-105 active:scale-95 transition-all">
            ¡Necesito una tienda como esta!
        </button>

        <div class="flex flex-col gap-1">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
            © {{ currentYear }} 
                <button (click)="irAHome()"
                    class="text-[9px] font-black text-gray-500 hover:text-brand-accent transition-colors uppercase tracking-widest">
                    Powered by {{ BRAND_DATA.name }}
                </button>
            </p>
            
        </div>
    
    </div>
</footer>
