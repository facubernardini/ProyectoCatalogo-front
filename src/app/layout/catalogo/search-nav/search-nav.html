<div #sentinel class="h-px w-full pointer-events-none"></div>

<div #stickyHeader
    class="sticky top-0 z-40 w-full transition-all duration-500 ease-in-out"
    [class.bg-white/70]="isStuck()"
    [class.backdrop-blur-md]="isStuck()"
    [class.shadow-xl]="isStuck()"
    [class.rounded-b-[32px]]="isStuck()"
    [class.py-2]="isStuck()"
    [class.py-1]="!isStuck()"
    [class.bg-transparent]="!isStuck()">
    
    <div class="w-full max-w-7xl mx-auto px-4 py-2 flex items-center gap-3">
        <button (click)="menuService.open()" 
                class="relative shrink-0 p-2.5 bg-white border border-brand-bg text-brand-text rounded-xl shadow-sm active:scale-90 transition-transform" 
                aria-label="Ver carrito">
            <app-icon name="menu" classes="size-6 fill-current" />
        </button>

        <div class="relative flex-1 group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <app-icon name="search" classes="size-5 fill-current text-brand-accent" />
            </div>

            <input 
                type="text" 
                placeholder="Buscar productos..."
                [value]="searchService.query()"
                (input)="onSearch($event)"
                class="w-full pl-11 pr-10 py-3 bg-white border border-brand-bg rounded-xl 
                    text-brand-text placeholder:text-brand-text-sec/60
                    focus:outline-none focus:ring-4 focus:ring-brand-bg focus:border-brand-accent 
                    transition-all duration-300 shadow-sm"
            >

            @if (searchService.query()) {
                <button (click)="clearSearch()" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-brand-accent">
                    <app-icon name="close-circle" classes="size-5 fill-current" />
                </button>
            }
        </div>

        <button (click)="cartService.open()" 
                class="relative shrink-0 p-2.5 bg-white border border-brand-bg text-brand-text rounded-xl shadow-sm active:scale-90 transition-transform" 
                aria-label="Ver carrito">
            <app-icon name="shopping_cart" classes="size-6 fill-current" />
            
            @if (cartService.totalItems() > 0) {
                <span class="absolute -top-1 -right-1 flex size-5 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white border-2 border-white animate-in zoom-in">
                    {{ cartService.totalItems() }}
                </span>
            }
        </button>
    </div>
</div>
